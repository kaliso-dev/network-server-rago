name: RagoPractice
version: ${version}
main: gg.rago.practice.RagoPractice
author: Rago
description: "The practice modes of Rago Practice, played from the lobby (duels, trainings, bots and an open arena)."
depend: [RagoLobby]
commands:
  aimtop:
    description: The best scores of the aim trainer.
    usage: /aimtop [strafe|jump|circle]
    aliases: [topaim]
  speed:
    description: Take the Speed II of the boxing off, or get it back.
    usage: /speed
  host:
    description: Host an event for the whole server (PREMIUM): Sumo, Brackets or Last Man Standing.
    usage: /host [sumo|brackets|lms]
    aliases: [hostevent]
  event:
    description: The event running now; join, leave, or call it off (its host, the staff).
    usage: /event [join|leave|cancel]
    aliases: [events]
  join:
    description: Join the event that waits for its players.
    usage: /join
    aliases: [joinevent]
permissions:
  rago.perk.host:
    description: Host events with /host (the PREMIUM rank of the lobby gives it).
    default: op
