# RagoPractice: the practice modes played from the lobby. How to use it: the README of the module.
# The keys stay in French: only the comments are English.

# The world of the arenas: an empty world the plugin creates if it does not exist. Every game has
# its own zone, "espacement" blocks from the previous one, and the server plays "arenes-max" games
# at once at most. Beyond that, players keep their place in the queue.
monde-arenes: arenes
espacement: 200
arenes-max: 16

# Sumo duel (the "sumo" mode of the lobby): knock the other player off the platform. No damage,
# only the knockback of RagoCombatEngine.
sumo:
  points-pour-gagner: 3
  # Radius of the round platform, in blocks (4 to 15), when none of the maps below is on the server.
  rayon: 7
  # The sumo maps: worlds of the folder of the worlds (mondes). Each zone of the sumo gets one of
  # them, copied from the start of the server (a few thousand blocks each tick), and each duel
  # draws one at random. "centre": the block in the middle of the top of the platform (standing on
  # it, F3 gives x, y + 1, z); "zone": the two corners of the box copied around it, at most
  # espacement / 2 - 1 blocks from the centre on x and z. A map the server does not have is left out.
  cartes:
    - monde: "Ponsen"
      centre: [0, 64, 0]
      zone: [-47, 53, -47, 47, 116, 47]
    - monde: "Fort Royale"
      centre: [0, 71, 0]
      zone: [-34, 58, -35, 34, 108, 35]
    - monde: "White Crystal"
      centre: [0, 64, 0]
      zone: [-55, 47, -79, 53, 158, 55]
    - monde: "Space Mine"
      centre: [0, 64, 0]
      zone: [-89, 0, -91, 60, 126, 98]
    - monde: "Sumo"
      centre: [0, 95, 0]
      zone: [-22, 57, -24, 22, 96, 44]

# The other duels: how many points win (in boxing, how many hits). A point is a death or a fall
# into the void of the other side; in 2v2, when both players of a side are out of the round.
points-pour-gagner:
  boxing: 100
  kb-displace: 3
  bridge-fight: 3
  block-fight: 5
  top-fight: 3

# Attack and defense: the defenders build for construction-secondes while the attackers wait,
# then the attackers have attaque-secondes to break the bed. The sides swap each round; manches
# is even, so that each side attacks as often.
attaque-defense:
  construction-secondes: 30
  attaque-secondes: 120
  manches: 2

# Aim trainer: each second with the crosshair on the target (or a hit) gives xp-par-seconde
# Network XP, and the end of the attempt one more for each touches-par-xp hits (100 hits: 10).
aim-trainer:
  xp-par-seconde: 1
  touches-par-xp: 10

# Block in practice on your own map, Ultimate Block-In Practice: put the folder of the world in the
# folder of the worlds (mondes) of the server. Its island is copied into each zone, without the
# command blocks and the redstone; the bed and its defense come back at each attempt. Without
# that world, the training plays on a plain island of the plugin's own.
block-in:
  monde: "Ultimate Block-In Practice"
  # the foot and the head of the bed, on the map
  lit: [-72, 66, -26]
  tete: [-73, 66, -26]
  # the two corners of the box copied: the whole island, under the bed and over it
  zone: [-92, 50, -42, -60, 80, -12]
  # where the player starts, as /tp on the map: x, y, z, yaw, pitch. The first one on the side
  # of the wood, the second one on the side of the wool (the corners of the ring of glass).
  departs:
    - [-68, 76, -22, 135, 60]
    - [-68, 76, -30, 45, 60]
