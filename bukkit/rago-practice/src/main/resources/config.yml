# The other duels: how many points win (in boxing, how many hits). A point is a death or a fall
# into the void of the other side; in 2v2, when both players of a side are out of the round. In
# block placement (block-fight), as on Minemen, a point is a hit, and a fall into the void gives
# the other side 20 points (from 10 to 500).
points-pour-gagner:
  boxing: 100
  kb-displace: 3
  block-fight: 100
  block-edit: 5
  bridge-fight: 5
  # the bow 1v1: each arrow that hits is a point (from 1 to 50)
  bow: 10

# The block placement duels (1v1 and 2v2) play on these maps of the owner, as the boxing on its
# arenas: "departs" are the gold blocks where each side starts (x, y of the feet, z, yaw); in 2v2,
# teammates stand side by side there. The kit of the maps (wooden sword, pickaxe, axe, shears,
# wool, end stone, ladders) is the kit of the mode in the lobby's config.yml. Without these
# worlds: two small platforms over the void.
block-fight:
  cartes:
    - monde: "BlockPlacement map 1"
      centre: [944699, 86, 944699]
      zone: [944671, 82, 944671, 944727, 129, 944727]
      departs: [[944699, 87, 944684, 0], [944699, 87, 944714, 180]]
    - monde: "BlockPlacement map 2"
      centre: [938786, 88, 938775]
      zone: [938751, 81, 938751, 938821, 113, 938799]
      departs: [[938786, 89, 938758, 0], [938786, 89, 938792, 180]]
    - monde: "BlockPlacement map 4"
      centre: [937127, 90, 937128]
      zone: [937103, 87, 937103, 937151, 108, 937153]
      departs: [[937127, 91, 937114, 0], [937127, 91, 937142, 180]]

# The block placement arena (open to everyone) plays on this map of the owner: its green arena in
# its walls of barriers. The players come in anywhere on the grass; its slime blocks (the one in the
# black pit of the corner) throw whoever stands on them three blocks up and two forward. Its gold
# blocks (the one in the middle) only mark it and go. Without that world: a platform and four
# islands over the void.
block-fight-arena:
  cartes:
    - monde: "Arena"
      centre: [-85, 102, 93]
      zone: [-126, 99, 52, -45, 120, 137]

# The bridge fight (open to everyone) plays on this map of the owner: the lowest floor of "Bridge
# Fight Plateform", its five platforms (two blue and yellow, two black and lime, the red H in
# yellow) and the three portals between them. The platforms are its floors of wool or stained clay at
# the height of the centre; a portal is a booth around a sea lantern on its floor (7 by 7, 9 high).
# A click on a portal takes the player to the platform on the other side of it, the one they look
# at through it; the portal with none in line (the middle one) opens the menu of the platforms.
# A player comes in, and back after a death, in the booth nearest to their platform (the little
# white island of quartz), on its sea lantern in the middle of the diamond, facing the platform.
# Its barriers are not copied: a player knocked off falls into the void. Without that world: four
# platforms of the plugin's own, linked by bridges.
bridge-fight:
  cartes:
    - monde: "Bridge Fight Plateform"
      centre: [85, 107, 83]
      zone: [58, 105, 50, 112, 116, 112]
  # The armour of the 1v1 (bridge-fight-1v1): Protection of this level (0 for none, 4 at most).
  protection-1v1: 2

# The fireball fight plays on these maps of the owner, as the boxing on its arenas: "departs",
# where each side starts (x, y of the feet, z, yaw). The beds are the map's own: each bed belongs
# to the side whose start is nearer. "lits" puts in the beds a map lost (x, y, z of the foot, x, z
# of the head each). Without maps: two islands of the plugin's own.
# Fireball Fight: the owner's second fireball map (Firefight map pas finit 2), whose west island
# lost its bed: it comes back in its defense of end stone, as on the east island.
fireball:
  cartes:
    - monde: "Fireball Fight"
      centre: [394255, 91, 394192]
      zone: [394163, 77, 394163, 394335, 119, 394221]
      departs: [[394178, 92, 394192, -90], [394332, 92, 394192, 90]]
      lits: [[394184, 91, 394195, 394185, 394195]]

# Attack and defense, as a rush of a solo Bed Wars game on Hypixel: the defender is at home next
# to a bed with no defense, the attacker already on a bridge with three blocks of void left. The
# defender covers the bed and holds attaque-secondes (back 3 s after a death); the attacker breaks
# it (an attacker who dies has failed the rush). The sides swap each round; manches is even, so
# that each side attacks as often.
# The island is a solo island of a Bed Wars map of the server (monde), copied once: the box of the
# zone, the bed (lit), the defender's start (defenseur: x, y, z, yaw) and the attacker's bridge
# from its far end to its near end (pont), in the coordinates of the map. Here the red island of
# Lotus. Without that world, a plain island.
attaque-defense:
  attaque-secondes: 60
  manches: 2
  monde: Lotus
  zone: [-55, 58, -102, -16, 84, -70]
  lit: [-34, 66, -76]
  defenseur: [-34, 65, -82, 0]
  pont: [-34, 65, -58, -34, 65, -68]

# Network XP of the trainings and the free arenas (block clutch, bridge fight), where no game is won:
# par-minute for each minute played, essai for an attempt that failed, reussite for one that worked
# (a time, a streak that goes on), never more than max-par-minute in a minute. It goes to the
# lobby every two minutes and when the player leaves. The duels give theirs at the end (xp-victoire,
# xp-defaite of the lobby); the aim trainer gives its own (below).
xp-entrainement:
  par-minute: 1
  essai: 1
  reussite: 3
  max-par-minute: 8

# The events PREMIUM players host with /host (the permission rago.perk.host, given by the PREMIUM
# rank of the lobby), as on Minemen: Sumo, Brackets (1v1 tournament with a sword and armour) and
# Last Man Standing. They play on the sumo maps above (one at a time), in the hidden modes
# event-sumo, event-brackets and event-lms of the lobby's config.yml. The whole server is told with
# a [Click to join] for attente-secondes, then the event starts with joueurs-min players at least
# (otherwise it is called off), joueurs-max at most. A host waits cooldown-minutes before hosting
# again (the staff, rago.staff, never waits), and the server pause-secondes between two events.
# The winner gets xp-gagnant Network XP, every other player xp-participation.
evenements:
  attente-secondes: 60
  joueurs-min: 2
  joueurs-max: 40
  cooldown-minutes: 30
  pause-secondes: 120
  xp-gagnant: 250
  xp-participation: 25

# Aim trainer: each second with the crosshair on the target (or a hit) gives xp-par-seconde
# Network XP, and the end of the attempt one more for each touches-par-xp hits (100 hits: 10).
aim-trainer:
  xp-par-seconde: 1
  touches-par-xp: 10

# Pearl practice on a part of Sky Rise (the red island, the diamond island in front of it and the
# emerald island of the middle): put the folder of the world in the folder of the worlds (mondes).
# Without it, plain islands at the same places. No block goes under limite-basse (the height on
# the map), as under the islands on Hypixel.
pearl:
  monde: SkyRise
  limite-basse: 55

# Block in practice on your own map, Ultimate Block-In Practice: put the folder of the world in the
# folder of the worlds (mondes) of the server. Its island is copied into each zone, without the
# command blocks and the redstone; the bed and its defense come back at each attempt. Without
# that world, the training plays on a plain island of the plugin's own.
block-in:
  monde: "Ultimate Block-In Practice"
  # the foot and the head of the bed, on the map
  lit: [-72, 66, -26]
  tete: [-73, 66, -26]
  # the two corners of the box copied: the whole island, under the bed and over it
  zone: [-92, 50, -42, -60, 80, -12]
  # where the player starts, as /tp on the map: x, y, z, yaw, pitch. The first one on the side
  # of the wood, the second one on the side of the wool (the corners of the ring of glass).
  departs:
    - [-68, 76, -22, 135, 60]
    - [-68, 76, -30, 45, 60]

# KB displace (the duel and the drill against a bot) on the owner's map KbDisplace: its bridge and
# islands copied once ("centre" and "zone" as the sumo maps); "defenseur", the defender's place
# (the notch of the bridge, between its two raised blocks; the bot stands there), and "attaquant",
# where the attacker starts (the gold block), x, y, z, yaw each as F3 gives them. Only a hit from
# the attacker's side, in the line of the bridge, counts. Without the world (or without this
# section): the plugin's own bridge.
kb-displace:
  monde: "KbDisplace"
  centre: [896056, 97, 896085]
  zone: [896043, 82, 896056, 896069, 113, 896113]
  defenseur: [896056.5, 98, 896081.5, 0]
  attaquant: [896056.5, 98, 896090.5, 180]

# Block extend on the owner's map BlockClutchExtend: the player starts at an exact place of a
# bridge, frozen until the hit (no move, no turn), takes it and saves themselves with their wool. The gold, diamond and emerald blocks
# of the map are wool in the game. "centre" and "zone": as the sumo maps. For each level (or,
# diamant, emeraude): "depart", x, y, z, yaw, pitch as F3 gives them (decimals welcome); "cible",
# the block to save oneself on; "force", the hit, horizontal then vertical (a hit of a fight:
# 0.42, 0.36; a sprint hit: 0.80, 0.43; a big hit: 0.68, 0.40; 0.10 more horizontal is about one
# block further, 0.30 less vertical about one block lower); and where it throws: "coup", where the
# hit comes from as the player looks at the start (devant: straight back; droite, gauche, derriere:
# a hit from the right throws to the left), or "vers", the x, z of a point. Without the world:
# plain blocks at the places.
block-extend:
  monde: "BlockClutchExtend"
  centre: [870603, 91, 870629]
  zone: [870583, 78, 870583, 870623, 136, 870675]
  niveaux:
    or:
      depart: [870604.589, 101, 870630.939, -179.9, 1.3]
      cible: [870600, 96, 870635]
      coup: devant
      force: [0.80, 0.55]
    diamant:
      depart: [870613.518, 101, 870620.339, 179.7, 2.6]
      cible: [870605, 95, 870619]
      coup: droite
      force: [0.80, 0.43]
    emeraude:
      depart: [870598.424, 98, 870612.227, 179.4, 1.4]
      cible: [870598, 91, 870613]
      coup: devant
      force: [0.85, 0.12]

# Block clutch on the owner's map BlockClutchNew: its island alone, its bed and its end stone
