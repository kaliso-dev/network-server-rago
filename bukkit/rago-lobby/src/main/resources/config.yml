    avantages: ["A light blue name and the &b[VIP]&7 tag", "+25% Network XP in every game", "/fly in the lobby",
      "Speed I, II or III in the lobby (settings)", "Your arrival announced, with a firework", "White messages, no chat cooldown",
      "Priority in the queues, not in Ranked (after PREMIUM+)", "3 cosmetics: the Clouds trail,", "the Heart burst kill, the Love win"]
# The colours of name and the badges (/style). A colour is a gradient along the letters of the
# name, made of the 16 colours of 1.8 (degrade: the colour characters from the first letter to the
# last, 0 to 9 and a to f: "5ddfd" goes from purple to pink to white; one character for one colour);
# gras: true for a bold name. Above the head a name takes one colour: the middle one. A badge is a
# short word after the name (texte, 15 characters at most with its colour codes). obtention says
# how a player gets it: premium (with a rank whose style or badge it is), achat (the web store
# gives it: /style give <player> couleur-feu, from the console), niveau (a reward of the Network
# levels, niveau.recompenses), points (bought in /style for prix Rago Points), semaine (the top of
# the leaderboards of the week wears it until the next results, semaine:). A gradient is
# animated: its colours run along the name in the tab list only (about three times a second);
# above the head the name keeps one fixed colour, the middle of the gradient (anime: false for a
# fixed gradient). A player wears one colour and one badge at a time.
styles:
  couleurs:
    rose: {nom: "Pink", degrade: "5ddfd", obtention: premium}
    feu: {nom: "Fire", degrade: "4c6e", obtention: achat}
    ocean: {nom: "Ocean", degrade: "19b3", obtention: achat}
    foret: {nom: "Forest", degrade: "2ae", obtention: achat}
    coucher: {nom: "Sunset", degrade: "5dc6e", obtention: achat}
    glace: {nom: "Ice", degrade: "fb3b", obtention: achat}
    galaxie: {nom: "Galaxy", degrade: "159d", obtention: achat}
    arc-en-ciel: {nom: "Rainbow", degrade: "c6eab9d", obtention: achat}
    ombre: {nom: "Shadow", degrade: "0878", obtention: achat}
    aqua: {nom: "Aqua", degrade: "b", obtention: niveau}
    or: {nom: "Gold", degrade: "6", obtention: niveau}
    legende: {nom: "Legend", degrade: "6eef6", gras: true, obtention: niveau}
    rouge: {nom: "Red", degrade: "c", obtention: points, prix: 3000}
    vert: {nom: "Green", degrade: "a", obtention: points, prix: 3000}
    bleu: {nom: "Blue", degrade: "9", obtention: points, prix: 3000}
    jaune: {nom: "Yellow", degrade: "e", obtention: points, prix: 3000}
