# RagoLobby: the main lobby of Rago Practice. How to use it: the README of the module.
# The keys stay in French (monde, titre, modes...): only the comments and the texts are English.

# The lobby world. If it does not exist, the plugin creates it: an empty world with a small
# platform. To use your map, put the name of its world here (for example the one given to
# /monde import), then /lobby setspawn where you want the spawn.
monde: lobby

# Below this height, a player who falls off the lobby goes back to the spawn.
hauteur-vide: 0

# The slime blocks of the lobby are launch pads, as on Hypixel: they throw whoever steps on them
# where they look, avant forward and haut up (blocks per tick, 0 to 4; avant: 0 and haut: 0 for
# plain slime blocks). 3.5 and 1.3 throw about 30 blocks away and 9 high (2.0 and 0.9: 16 and 5).
slime:
  avant: 3.5
  haut: 1.3

# The lobby scoreboard: its title (32 characters at most) and its last line.
titre: "&c&lRAGO PRACTICE"
adresse: "&erago.gg"

# The queues. A ranked queue matches players by their ELO (see elo: below), from
# elo-par-defaut before a player's first ranked game: the ELO gap accepted starts at
# ecart-elo-initial and grows by ecart-elo-pas every ecart-elo-secondes of waiting, up to
# ecart-elo-max. A player who leaves a ranked game they still play (/spawn, Play again, leaving
# the server) cannot join a ranked queue for abandon-classe-minutes (0 to 60, 0 for never), as on
# the ranked servers: not after a /duel nor a party's private game, which move no ELO.
file:
  elo-par-defaut: 0
  ecart-elo-initial: 100
  ecart-elo-pas: 50
  ecart-elo-secondes: 10
  ecart-elo-max: 500
  abandon-classe-minutes: 5

# After a won game (Bed Wars, a duel), the seconds everyone stays in the arena to see the winners
# and their victory effect, with the Play again paper and the Leave bed usable at once (and
# [PLAY AGAIN] [LEAVE] in the chat), before going back to the lobby: 0 to 10, 0 for at once.
fin-de-partie-secondes: 3

# Replays: the duels and the Bed Wars games are recorded, and /replay shows a player their last
# games (or any game by its code, /replay CODE; [REPLAY] at the end of a game). Kept "jours" days,
# within "taille-max-mo" MB (the oldest go first) in plugins/RagoLobby/replays: a few dozen KB
# for a duel, a few hundred for a Bed Wars game. spectateurs-max: replays watched at the same time.
# actif: false records nothing.
replays:
  actif: true
  jours: 3
  taille-max-mo: 2000
  spectateurs-max: 6

# The compass (the owner's asks of 22/11, 17h54 and 19h51): six rows; its top row holds these
# categories or groups (groupes:), in this order, one slot apart and centred; the other categories
# (those of the lobby NPCs) go in the middle, one slot apart up to five (side by side beyond), and
# "Popular now" in the bottom row. A group (Red Rover) opens its modes, whose back button comes
# back to the compass. Empty or missing: the compass as before, in three rows, "Popular now" on top
# and every category in the middle row.
boussole:
  haut: [classe, party, red-rover, trois-joueurs]

# The categories of the selector, one per zone of the lobby, in the order of the menu (9 at most,
# side by side in the top row of the compass): left to right, as in the lobby. The compass first
# shows the categories, then the games of the one picked (28 modes at most per category). Without
# a categories section, the compass shows every mode at once (35 at most). slogan: what a player
# does there, in a few words (40 characters at most, colours not counted): under its name in the
# compass, under its NPC, and in the welcome of the lobby; its key words in the colour of the
# category, the rest in grey (&7). party: true makes it the category of the parties (one at
# most): no modes of its own, the games each viewer's party plays against itself at its size.
categories:
  entrainement:
    nom: "&b&lPractice"
    icone: SANDSTONE
    slogan: "&bTrain alone&7, at your &bown pace"
    description:
      - "Clutch, block in, fast defense,"
      - "bridging, extend, pearls, bow,"
      - "fireballs, aim, bots: one skill"
      - "at a time."
  ranked:
    nom: "&6&lRBW Modes"
    icone: BED
    slogan: "&6RBW situations &7to practice"
    description:
      - "Modes close to Ranked Bedwars:"
      - "Sky Rise, first rush, invis,"
      - "clutch scenarios, attack and"
      - "defense, Bed Break Simulator,"
      - "private games. With the server"
      - "or your friends. Ranked Bedwars"
      - "is in Ranked."
  duels:
    nom: "&a&lDuels"
    icone: IRON_SWORD
    slogan: "&aDuel your friends &7or &aanyone"
    description:
      - "Bed fight, Top BedFight, top"
      - "bridge, bridge fight, block"
      - "placement in 1v1 or 2v2; Lobby"
      - "Fight, sumo, boxing, KB displace,"
      - "fireball fight, bow."
      - "/duel a player to challenge them."
  # the modes without a queue: in at once, with whoever is there
  arenes:
    nom: "&c&lArenas"
    icone: DIAMOND_SWORD
    slogan: "&cJump in &7and &cfight now"
    description:
      - "No queue, come and go when you"
      - "like: the FFA, Top Bridge FFA,"
      - "Lobby Fight FFA, bridge fight,"
      - "block placement arena and Arena"
      - "Free. Someone to fight at once."
  # FUN PRACTICE (plan 6.1): the fun modes, one after the other
  fun:
    nom: "&d&lFun Practice"
    icone: SNOW_BALL
    slogan: "&dFun modes &7to play with &danyone"
    description:
      - "Fireball Fight: knock them off"
      - "with fireballs, three at once;"
      - "Snowball Spleef: break the snow"
      - "under their feet; Capture the"
      - "Flag on The Bridge or castle"
      - "against castle; Fast Bedwars;"
      - "Parkour Duel: race them to the"
      - "finish."
  # The games for three players (plan 6.6), in the compass only (the owner's choice, 21/11): no NPC.
  # aussi: the modes (or groups) of other categories it shows too, with the same queues: Red Rover
  # of the Duels, the 1v2 of the RBW modes. Its name, slogan and description are to confirm.
  trois-joueurs:
    nom: "&e&l3 Players"
    icone: SKULL_ITEM
    slogan: "&eThree friends&7? Play &etogether"
    description:
      - "Red Rover: 1v1 in turn, who"
      - "waits watches. Bed Break"
      - "Simulator, Invis Practice,"
      - "Clutch Scenario and Bed Fight:"
      - "one against two."
    aussi: [red-rover, bed-break-simulator-1v2, invis-practice-1v2, clutch-scenario-1v2, bed-fight-1v2]
  # PARTY (plan 3.7): no modes of its own (party: true). The compass shows there what the viewer's
  # party plays against itself, at its size: two players the 1v1s, three the 1v2s and Red Rover,
  # four the 2v2s... (a private game, in no stats). A party that fits in one team (two players in a
  # 2v2) still queues against others from the other categories, ranked too (with the mean ELO).
  party:
    nom: "&9&lParty"
    icone: NAME_TAG
    slogan: "&9Your party &7against &9itself"
    party: true
    description:
      - "The games your party plays"
      - "against itself, at its size."
      - "Only the leader starts one."
  # RANKED (plan 3.7, the owner's choice of 22/11): every ranked mode (classe: true), each with its
  # own ELO, division, queue by ELO and leaderboard: Ranked Bedwars 1v1 to 4v4, and the six great
  # duels in 1v1, the same games as their unranked modes (same maps, same kit, arranged once in the
  # kit editor), with their own queue. /duel and the private games of a party are never ranked.
  classe:
    nom: "&6&lRanked"
    icone: DIAMOND_SWORD
    slogan: "&6Your ELO &7in every game"
    description:
      - "Ranked Bedwars 1v1 to 4v4, and"
      - "Bed Fight, Top Bridge, Bridge"
      - "Fight, Block Placement, Sumo"
      - "and Boxing in 1v1: each with"
      - "its own ELO and divisions."

# At each arrival in the lobby, the ways to play in the chat: a line per category (its name and
# slogan), a click opens its modes (/play category); at the first arrival, a title too. false: none.
accueil: true

# At the first arrival on the server, a menu "What do you want to do?": each choice a click away
# from playing, and Getting started (the quests of a new player) under them. Per choice: nom,
# icone, description, and mode (joins its queue, a training starts at once; while the mode is not
# played, its category opens) or categorie (opens that category). 7 at most. {}: no menu.
premiere-venue:
  entrainer:
    nom: "&bTrain a skill"
    icone: LADDER
    mode: clutch
    description:
      - "Start with the block clutch:"
      - "a hit throws you off, place"
      - "your wool to save yourself."
  ranked:
    nom: "&6Play Ranked Bedwars"
    icone: BED
    mode: ranked-1v1
    description:
      - "1v1 on the RBW maps, your ELO"
      - "from the first game. Train"
      - "while you wait."
  duel:
    nom: "&aDuel a friend"
    icone: IRON_SWORD
    categorie: duels
    description:
      - "/duel <player> challenges a"
      - "friend; or a duel with anyone:"
      - "sumo, boxing, bridge..."
  arenes:
    nom: "&cFight now"
    icone: STONE_SWORD
    mode: ffa
    description:
      - "The FFA: no queue, in at once"
      - "with whoever is there."

# The groups: the sizes of one game (1v1, 2v2...), one item in their category which opens them
# side by side, as the games of Hypixel. A mode is in a group with groupe: (the modes of a group
# are of one category); the item shows where its first mode is in the list of the modes.
groupes:
  ranked:
    nom: "&6&lRanked Bedwars"
    icone: BED
    description:
      - "Ranked Bedwars on the 20 maps"
      - "of the RBW queue: your ELO goes"
      - "up or down after every game."
  skyrise:
    nom: "&6RBW Sky Rise"
    icone: DIAMOND_CHESTPLATE
    description:
      - "A Bedwars, RBW style,"
      - "on Sky Rise."
  first-rush:
    nom: "&6First rush"
    icone: IRON_PICKAXE
    description:
      - "A real Bedwars, RBW style, on"
      - "two islands side by side: the"
      - "first rush decides it."
  # the duels (category duels): each in 1v1 or 2v2; queued alone in a 2v2, a teammate is found
  # in the queue, and the lobby is told: "Name's team is queuing Bed fight 2v2 [JOIN NOW]"
  bed-fight:
    nom: "&aBed fight"
    icone: BED
    description:
      - "Two islands, a bed each: break"
      - "theirs and kill them. You come"
      - "back while your bed stands."
  red-rover:
    nom: "&aRed Rover"
    icone: REDSTONE
    description:
      - "Three players, 1v1 in turn,"
      - "who waits watches: the sumo,"
      - "the block edit, the block"
      - "placement, the top bridge."
  top-bridge:
    nom: "&aTop Bridge"
    icone: LADDER
    description:
      - "The fight on the top bridge of"
      - "Antenna, on the 20 RBW maps:"
      - "rounds to 5 points in 1v1 or"
      - "2v2."
  clutch-scenario:
    nom: "&6Clutch scenario"
    icone: IRON_CHESTPLATE
    description:
      - "A real RBW game on Sky Rise"
      - "or Archway, bridges built:"
      - "one team has lost its bed,"
      - "iron armour, stone sword,"
      - "full forges. Clutch or defend."
  bridge-fight:
    nom: "&aBridge fight"
    icone: WOOL
    description:
      - "On a wool platform, no blocks:"
      - "a 1v1 or a 2v2, first to 5."
  block-placement:
    nom: "&aBlock placement"
    icone: SANDSTONE
    description:
      - "Build, clutch and fight on the"
      - "block placement maps: 1v1"
      - "or 2v2."
  prive:
    nom: "&6Private games"
    icone: NAME_TAG
    description:
      - "With your party: Bedwars"
      - "Normal on a map of 4s or 2s,"
      - "2 to 16 players."
  attack-defense:
    nom: "&6Attack and defense"
    icone: IRON_SWORD
    description:
      - "Bio Hazard: attack from the"
      - "bridge with one life, defend"
      - "with your forge and shop."
  # the invis practice and the Bed Break Simulator, from 1v1 to 1v4: one player attacks, the
  # others defend, each in turn
  invis:
    nom: "&6Invis practice"
    icone: POTION
    description:
      - "The 20 RBW maps, 3-minute"
      - "rounds: an attacker with an"
      - "invis potion, from mid, against"
      - "the defenders of the bed, each"
      - "player in turn: 1v1 to 1v4."
  bed-break:
    nom: "&6Bed Break Simulator"
    icone: DIAMOND_PICKAXE
    description:
      - "Archway or Invasion: attack"
      - "from the top with one of"
      - "3 kits and break the bed; the"
      - "defenders have their forge full."
      - "Each in turn, 1v1 to 1v4."
  # Capture the Flag (category fun)
  ctf-bridge:
    nom: "&dCTF The Bridge"
    icone: BOW
    description:
      - "The Bridge with a flag in each"
      - "base: take theirs, bring it"
      - "home. 1v1 or 2v2."
  ctf-castle:
    nom: "&dCTF Castle"
    icone: IRON_SWORD
    description:
      - "A big map, castle against"
      - "castle and a mid: Bed Wars with"
      - "a flag in each keep. 2v2, 4v4."
  # Fast Bedwars (category fun)
  fast-bedwars:
    nom: "&dFast Bedwars"
    icone: BED
    description:
      - "Bed Wars, fast and simple:"
      - "faster forges, earlier events,"
      - "a smaller shop. 1v1 or 2v2."
  clutch:
    nom: "&bBlock clutch"
    icone: LADDER
    description:
      - "A hit throws you off: place"
      - "your wool to save yourself."
      - "On an island, or a top fight."

# The NPCs of the lobby. Each one stands on a point placed with /lobby point <name> (the key) and
# opens its modes: a click joins the queue if it has only one, else opens a menu of its modes.
# An NPC whose point is not placed yet does not show.
#   skin   the skin it wears: skins/<skin>.png in the folder of the plugin (64x64, yours), else
#          the one of that name in the jar (attaque, clutch, ranked, prive, ffa, skyrise, rush,
#          invis, bridge, arena, blocs, duels, practice, fun, shop, stats, quetes). Without it:
#          Steve. The NPCs wear no item in their hands (the owner's ask of 22/11).
#          A 1.8 client shows a skin on an NPC only once Mojang signed it: at the start the server
#          sends each new PNG once to MineSkin (api.mineskin.org) and keeps the answer in skins.yml.
#   skin-joueur  in place of skin: the skin of this Minecraft account (its name), read from Mojang
#          at each start and kept in skins-joueurs.yml (worn at once on the next start).
#   bloc   the block it stands on, put where the feet were on its point (the NPC one block
#          higher): a name or an id, with its data after a colon (QUARTZ_BLOCK, "STONE:6",
#          "159:14"). If that block is already under the point, on its own (you put it there; not
#          a floor of it), the NPC stands on it and nothing is put. Without it: polished andesite,
#          as on Hypixel.
pnj:
  # The ways to play: each NPC opens its whole category (the menu of the compass), with the slogan
  # of the category under its name (sous-titre: another line), on a block of quartz. Their
  # points: /lobby point practice, rbw, duels, arenas.
  practice:
    nom: "&b&lPractice"
    categorie: entrainement
    skin: practice
    bloc: QUARTZ_BLOCK
  rbw:
    nom: "&6&lRBW Modes"
    categorie: ranked
    skin: ranked
    bloc: QUARTZ_BLOCK
  duels:
    nom: "&a&lDuels"
    categorie: duels
    skin: duels
    bloc: QUARTZ_BLOCK
  arenas:
    nom: "&c&lArenas"
    categorie: arenes
    skin: arena
    bloc: QUARTZ_BLOCK
  # FUN PRACTICE (plan 6.1): the NPC of the Fun Practice, on the point prive, where the Private
  # game NPC stood (the owner's ask of 22/11: the Fun Practice NPC in its place, no Private game
  # NPC), on a block of quartz. The private games are in the RBW Modes (the item Private games).
  # Its point before, funmod2, has no NPC any more.
  prive:
    nom: "&d&lFun Practice"
    categorie: fun
    skin: fun
    bloc: QUARTZ_BLOCK
  # Only the NPCs of the ways to play, so that a new player is not lost: every mode stays in its
  # category, in the compass and in the menus of the four. Remove the # before the lines of one to
  # show it again, on its point (/lobby point <name>; for the ones without a point now, place a
  # new one).
  # ranked:
  #   nom: "&6&lRanked Bedwars"
  #   skin: ranked
  #   modes: [ranked-1v1, ranked-2v2, ranked-3v3, ranked-4v4]
  # ffa:
  #   nom: "&cFFA and Top bridge"
  #   skin: ffa
  #   modes: [ffa, top-bridge-1v1, top-bridge-2v2, top-bridge-ffa]
  # clutchscenario:
  #   nom: "&6Clutch Scenario"
  #   skin: clutch
  #   modes: [clutch-scenario-1v1, clutch-scenario-1v2, clutch-scenario-1v3, clutch-scenario-1v4]
  # attackanddefense:
  #   nom: "&6Attack and Defense"
  #   skin: attaque
  #   modes: [attack-defense-1v1, attack-defense-2v2]
  # rbwsolo1v1ou2v2skyrise:
  #   nom: "&6RBW Sky Rise"
  #   skin: skyrise
  #   modes: [skyrise-1v1, skyrise-2v2]
  # firstrushnebucgelatosoloduo:
  #   nom: "&6First rush"
  #   skin: rush
  #   modes: [first-rush, first-rush-duo]
  # invispracticearwhayinvasion:
  #   nom: "&6Invis practice"
  #   skin: invis
  #   modes: [invis-practice-1v1, invis-practice-1v2, invis-practice-1v3, invis-practice-1v4]
  # realisticplat:
  #   nom: "&aBridge fight"
  #   skin: bridge
  #   modes: [bridge-fight, bridge-fight-1v1, bridge-fight-2v2]
  # blockplacementarena:
  #   nom: "&aBlock placement"
  #   skin: blocs
  #   modes: [block-fight-1v1, block-fight-2v2, block-fight-arena]
  # The Private game NPC (Bedwars Normal with friends since 22/11), on a point of its own (/lobby
  # point partieprivee): the private games stay in the RBW Modes too.
  # partieprivee:
  #   nom: "&6&lPrivate game"
  #   sous-titre: "&7Your game, your friends, your rules"
  #   skin: prive
  #   modes: [bedwars-normal]
  #   bloc: QUARTZ_BLOCK
  # The NPCs of the side zones, on their front sign, if you want them there too:
  # attackdefenseversionrbw:
  #   nom: "&a&lDuels"
  #   categorie: duels
  #   skin: duels
  # blockinpractice:
  #   nom: "&b&lPractice"
  #   categorie: entrainement
  #   skin: practice
  # The Shop NPC (type: shop), at the centre: a click opens the store, the starter pack
  # (pack-depart) and VIP, then what Rago Points buy. sous-titre: the line under its name. On a
  # block of emerald. Its point: /lobby point shop.
  shop:
    nom: "&a&lSHOP"
    sous-titre: "&6Starter Pack &7· &bVIP"
    type: shop
    skin: shop
    bloc: EMERALD_BLOCK
  # The stats NPCs (type: stats): everyone sees their own profile above it, and a click opens
  # their stats by category. nom: the first line of the profile. On a block of iron. Their
  # points: /lobby point profil, profil2.
  profil:
    nom: "&6&lYour Rago profile"
    type: stats
    skin: stats
    bloc: IRON_BLOCK
  profil2:
    nom: "&6&lYour Rago profile"
    type: stats
    skin: stats
    bloc: IRON_BLOCK
  # The leaderboard selector (type: selecteur): a click opens the menu of its stats, and the one
  # chosen shows at once on the three walls that follow it (selecteur: in classements:), Daily,
  # Weekly and Lifetime, for the one who chose. Its point: /lobby point newleaderboardselector.
  #   stats            its stats, in the order of the menu (victoires, parties, series, kills,
  #                    fkdr, niveau, wlr, elo: one item for each ranked mode); left out: series,
  #                    niveau, elo, victoires, kills, fkdr, wlr, parties
  #   minimum-parties  the games a ratio (FKDR, WLR) of a day and of a week needs, so that one game
  #                    is not the first: jour 5 and semaine 15 when left out; for the FKDR, the games
  #                    of the Bed Wars modes. Lifetime has none.
  # Over a day or a week, the Network level ranks the XP earned, the ELO the ELO won (or lost).
  newleaderboardselector:
    nom: "&b&lLEADERBOARDS"
    sous-titre: "&7Click to choose the stat"
    type: selecteur
    skin: stats
    minimum-parties: {jour: 5, semaine: 15}
  # The people of the server in the thank-you room (type: personne): their name after the prefix
  # of their rank (rang:, a rank of rangs:), as above a player's head, in the skin of their account;
  # a click does nothing. One block higher than their point, on their block: obsidian for the Owner
  # and the Dev; without bloc:, the block of every NPC. Their points: /lobby point qrago, kalisodev.
  qrago:
    nom: "qRago"
    type: personne
    rang: owner
    skin-joueur: qRago
    bloc: OBSIDIAN
  kalisodev:
    nom: "kaliso_dev"
    type: personne
    rang: dev
    skin-joueur: kaliso_dev
    bloc: OBSIDIAN
  # The moderators directement (point jncl) and woryes (point nativ), out of the thank-you room at
  # the owner's ask of 22/11 (17h56); their points stay in points.yml. To bring one back, take the
  # # off its lines:
  # jncl:
  #   nom: "directement"
  #   type: personne
  #   rang: mod
  #   skin-joueur: jncl
  # nativ:
  #   nom: "woryes"
  #   type: personne
  #   rang: mod
  #   skin-joueur: Woryes
  # OUR OTHER PRODUCTS (plan 5.6A), in the thank-you room (type: produit): its title (titre:) above
  # its name, a line under it if sous-titre: is given; a click shows its links in the chat, line by
  # line (liens:, from 1 to 8 lines). On a block of diamond. Their points: /lobby point ragoclient,
  # ragooptimizer.
  ragoclient:
    nom: "&b&lRago Client"
    type: produit
    titre: "&6&lOUR OTHER PRODUCTS"
    skin-joueur: qRago
    bloc: DIAMOND_BLOCK
    liens:
      - "&c&lRAGO &8» &fRago Client: &erago-optimizer.com"
      - "&c&lRAGO &8» &fJoin our Discord: &ediscord.gg/ragooptimizer"
  ragooptimizer:
    nom: "&b&lRago Optimizer"
    type: produit
    titre: "&6&lOUR OTHER PRODUCTS"
    skin-joueur: qRago
    bloc: DIAMOND_BLOCK
    liens:
      - "&c&lRAGO &8» &fRago Optimizer: &erago-optimizer.com"
      - "&c&lRAGO &8» &fJoin our Discord: &ediscord.gg/ragooptimizer"

# The texts of the lobby (textes:), each on its own point (/lobby point <name>), the same for
# everyone; a click does nothing. Its lines (lignes:, from 1 to 30, top to bottom, colours with &)
# float above the point: the last one half a block high, the others above it, 0.27 block apart
# (20 lines rise 5.6 blocks). "" leaves a gap; a line is 64 characters at most, its colour codes
# included (cut a longer one in two).
textes:
  # The thank-you text (plan 5.7, validated by the owner on 22/11), in the thank-you room, cut in
  # two (the owner's ask of 22/11, 19h51): its first part on the left (point textremerciement), the
  # rest on the right (point textremerciement2), cut between two sentences; the words as
  # validated. /lobby point textremerciement, and textremerciement2.
  textremerciement:
    lignes:
      - "&6&lTHANK YOU"
      - "&fRago Practice took a very long time to build, but I have"
