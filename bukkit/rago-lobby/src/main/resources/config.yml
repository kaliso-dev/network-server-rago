  shop:
    nom: "&a&lSHOP"
    sous-titre: "&cStarter Pack &7· &bVIP"
    type: shop
    skin: shop
  # The stats NPCs (type: stats): everyone sees their own profile above it, and a click opens
  # their stats mode by mode. nom: the first line of the profile. Their points: /lobby point
  # profil, profil2.
  profil:
    nom: "&6&lYour Rago profile"
    type: stats
    skin: stats
  profil2:
    nom: "&6&lYour Rago profile"
    type: stats
