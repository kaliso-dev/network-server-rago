    menthe: {nom: "Mint", degrade: "ab", anime: false, obtention: points, prix: 6000}
  badges:
    premium: {nom: "Premium", texte: "&d&l✦", obtention: premium}
    rago: {nom: "RAGO", texte: "&c&lRAGO", obtention: achat}
    better: {nom: "BETTER", texte: "&6&lBETTER", obtention: achat}
    pvp: {nom: "PVP", texte: "&4&lPVP", obtention: achat}
    yt: {nom: "YT", texte: "&c&lYT", obtention: achat}
