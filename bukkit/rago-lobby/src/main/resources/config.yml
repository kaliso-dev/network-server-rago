    - "&bClaim your daily reward with /daily: a few days in a row give more."
    - "&bAdd your friends with /friend add <name>, and play with them in a /party."
    - "&bClimb the ranked divisions, from Coal to Obsidian: /top elo."
    - "&bNews, store and more on &frago-optimizer.com&b."
    - "&a&lSHOP &8» &fRanks, cosmetics and the colour of your &d+&f: &a/shop"
    - "&d&lPREMIUM &8» &f+50% XP, /fly, the &d+&f and gadgets of its own: &drago-optimizer.com"
    - "&b&lRAGO OPTIMIZER &8» &fGet Rago Optimizer on &brago-optimizer.com"
    - "&a&lSHOP &8» &fEvery game gives Rago Points: spend them in the &a/shop&f."
    - "&b&lRAGO OPTIMIZER &8» &fNews and downloads: &brago-optimizer.com"
    - "&6&lSTARTER PACK &8» &f20,000 Rago Points, 5 boosters and 3 cosmetics for 3.99€: &e/pack"
    - "&6&lEVENTS &8» &d[PREMIUM+] &fhost Sumo, Brackets and LMS for the whole server: &e/host"

# What /discord, /site, /rules and /store show (one line or a list).
liens:
  discord: "&9Our Discord: &fdiscord.gg/ragooptimizer"
  site: "&bOur website: &frago-optimizer.com"
  boutique: "&aThe store: &frago-optimizer.com"
  regles:
