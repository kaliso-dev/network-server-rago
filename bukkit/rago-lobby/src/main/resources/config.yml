  # The Shop NPC (type: shop), at the centre: a click opens the store, the starter pack
  # (pack-depart) and VIP, then what Rago Points buy. sous-titre: the line under its name.
  # (Its point is still called aimtrainer: the aim trainer is in the Practice NPC.)
  aimtrainer:
    nom: "&a&lSHOP"
    sous-titre: "&eStarter Pack &7· &bVIP"
    type: shop
    skin: shop
  # The stats NPCs (type: stats): everyone sees their own profile above it, and a click opens
  # their stats mode by mode. nom: the first line of the profile.
  statsjoueur1:
    nom: "&6&lYour Rago profile"
    type: stats
    skin: stats
  statsjoueur2:
    nom: "&6&lYour Rago profile"
    type: stats
    skin: stats

# A MineSkin API key (free, https://account.mineskin.org/keys), only if MineSkin refuses to sign
# the skins of the NPCs without one (the log says so). "" asks without a key.
cle-mineskin: ""

# The Network level, from 1 to 100: every game gives XP to everyone who played it (more for a win),
# every kill a little more, and the quests (quetes:) much more. Everyone starts at level 1; going
# from level n to level n + 1 takes xp-niveau-2 + xp-en-plus-par-niveau x (n - 1) XP (100, 150,
# 200... by default: about 250,000 XP for the level 100). The level shows as [12*] (a star) before
# the name in the chat, after it above the head and in the tab list, in the XP bar of the lobby,
# the scoreboard and the brewing stand of the hotbar (/level). It unlocks the cosmetics of the shop.
#   couleurs     the colour of the [12*] from each level on, by tier (one or two colour codes, or
#                up to 8 colours for a rainbow, one per character: "&c&6&e&a&b&d")
#   recompenses  what a level gives (one every 5 levels by default): points (Rago Points) and
#                objets (cosmetics of the shop by id, colours of name and badges of styles: by key,
#                couleur-or, badge-centurion). A cosmetic already bought gives its price back.
niveau:
  xp-victoire: 50
  xp-defaite: 15
  xp-kill: 5
  xp-niveau-2: 100
  xp-en-plus-par-niveau: 50
  couleurs:
    1: "&7"
    10: "&f"
    20: "&6"
    30: "&b"
    40: "&2"
    50: "&3"
    60: "&4"
    70: "&d"
    80: "&9"
    90: "&5"
    100: "&c&6&e&a&b&d"
  recompenses:
    5: {points: 500, objets: [plus-jaune]}
    10: {objets: [trail-clouds]}
    15: {points: 1000, objets: [plus-vert]}
    20: {objets: [kill-hearts]}
    25: {objets: [couleur-aqua]}
    30: {points: 2000, objets: [plus-aqua]}
    35: {objets: [win-fireworks]}
    40: {objets: [trail-notes]}
    45: {points: 3000, objets: [plus-rouge]}
    50: {points: 5000, objets: [couleur-or]}
    55: {objets: [kill-lightning]}
    60: {objets: [trail-magic]}
    65: {points: 4000, objets: [plus-or]}
    70: {objets: [win-flames]}
    75: {objets: [kill-firework]}
    80: {points: 5000, objets: [trail-ender]}
    85: {objets: [win-party, plus-bleu]}
    90: {objets: [kill-explosion]}
    95: {objets: [trail-redstone]}
    100: {points: 10000, objets: [couleur-legende, badge-centurion]}

# The quests: daily ones (quotidiennes, again every day) and weekly ones (hebdomadaires, again
# every Monday), worth more. They run by themselves; a quest done gives its XP (boosted by
# PREMIUM) once. /quests, or the brewing stand of the hotbar, shows them.
#   nom       what the player reads
#   type      what counts: parties (games played), victoires (wins), kills, victoires-classees
#   objectif  how many; xp: the Network XP it gives; mode: count one mode only (its id)
quetes:
  quotidiennes:
    jouer: {nom: "Play 5 games", type: parties, objectif: 5, xp: 500}
    gagner: {nom: "Win 3 games", type: victoires, objectif: 3, xp: 750}
    kills: {nom: "Get 15 kills", type: kills, objectif: 15, xp: 500}
    classe: {nom: "Win a ranked game", type: victoires-classees, objectif: 1, xp: 750}
  hebdomadaires:
    jouer: {nom: "Play 40 games", type: parties, objectif: 40, xp: 3000}
    gagner: {nom: "Win 25 games", type: victoires, objectif: 25, xp: 5000}
    kills: {nom: "Get 100 kills", type: kills, objectif: 100, xp: 3000}
    classe: {nom: "Win 10 ranked games", type: victoires-classees, objectif: 10, xp: 5000}

# The ranks, the highest first: the order of the tab list, and a player shows the highest of
# theirs. The staff give a rank with /rank set <player> <rank>, the web store (or an admin) with
# /rank give <player> premium (or vip). A player has the permissions of all their ranks, and of the ranks
# these inherit (herite).
#   prefixe      before the name ("&c[ADMIN] "): with the colour of the name, 16 characters at most
#                (above the head, a longer one loses its brackets: [PREMIUM+] shows PREMIUM+). {+}
#                is a + each player colours in /style (styles.plus), white by default
#   couleur      the colour of the name
#   chat         the colour of the messages (a player without a rank writes in grey)
#   staff        true for a staff rank: never sold
#   permissions  what the rank gives: rago.admin (ranks, points, and all below), rago.mod (bans,
#                mutechat), rago.staff (staff chat, vanish, freeze, mutes, kicks, warnings),
#                rago.perk.chat (no chat cooldown), rago.perk.fly (/fly in the lobby),
#                rago.perk.join (the lobby hears the arrival), rago.perk.nick (/nick),
#                rago.perk.message (a message of one's own above the head), rago.perk.speed
#                (Speed I, II or III in the lobby, chosen in the settings), rago.perk.gadgets (the
#                gadgets and the rarest cosmetics of PREMIUM), rago.perk.booster (a free XP booster
#                a day, /booster), rago.perk.host (/host: events for the whole server, in
#                RagoPractice), rago.cosmetic.<id> (owns that cosmetic of the boutique while
#                having the rank: VIP's three), or a permission of
#                another plugin; "-permission" takes one away
#   herite       the rank whose permissions (and colours, badges, boost) this one also has
#   boost-xp     the Network XP of its players is multiplied by this (1.5: half more)
#   style, badge the colour of name and the badge (of styles:) its players wear until they choose
#                another with /style; they own them as long as they have the rank
#   boutique-en-ligne  true: sold on the web store, the shop shows the link (liens.boutique)
#   prix-en-ligne      its price on the web store, shown in the shop and the store ("$4.99")
#   priorite-file      its place in the queues, 0 to 9: the higher are matched first (PREMIUM+ 2,
#                VIP 1); after a minute of waiting everyone is first in line, and it never changes
#                who plays whom in a ranked queue (the ELO first)
#   prix, niveau the price in Rago Points and the Network level needed in the shop (prix: 0 = not sold)
#   prix-cadeau  what gifting it to another player costs in Rago Points (/gift, the shop, or the
#                menu of a player clicked in the lobby), a rank of the web store too; 0 or none:
#                its prix (a rank of the web store without one cannot be gifted). The lobby hears it
#                in a big message, with fireworks around the one who got it
#   icone        the item in the shop; avantages: its lines
rangs:
  owner:
    prefixe: "&4[OWNER] "
    couleur: "&4"
    staff: true
    permissions: [rago.admin]
    herite: admin
  admin:
    prefixe: "&c[ADMIN] "
    couleur: "&c"
    staff: true
    permissions: [rago.admin]
    herite: mod
  dev:
    prefixe: "&b[DEV] "
    couleur: "&b"
    staff: true
    permissions: [rago.admin]
    herite: mod
  mod:
    prefixe: "&2[MOD] "
    couleur: "&2"
    staff: true
    permissions: [rago.mod]
    herite: helper
  helper:
    prefixe: "&9[HELPER] "
    couleur: "&9"
    staff: true
    permissions: [rago.staff]
    herite: premium
  builder:
    prefixe: "&3[BUILDER] "
    couleur: "&3"
    staff: true
    permissions: [rago.staff, rago.lobby.admin]
    herite: premium
  media:
    prefixe: "&c[&fMEDIA&c] "
    couleur: "&c"
    herite: premium
    avantages: ["For content creators", "Everything of PREMIUM"]
  premium:
    prefixe: "&d[PREMIUM{+}] "
    couleur: "&d"
    permissions: [rago.perk.chat, rago.perk.fly, rago.perk.join, rago.perk.nick, rago.perk.message, rago.perk.speed,
      rago.perk.gadgets, rago.perk.booster, rago.perk.host]
    boost-xp: 1.5
    style: rose
    badge: premium
    herite: vip
    boutique-en-ligne: true
    prix-en-ligne: "$9.99"
    prix-cadeau: 50000
    priorite-file: 2
    icone: NETHER_STAR
    avantages: ["A pink gradient name and the &d&l✦&7 badge", "Your &f+&7 in the colour you choose (/style)", "+50% Network XP in every game", "/fly in the lobby",
      "Speed I, II or III in the lobby (settings)", "/nick: play under another name", "Your own message above your head", "Your arrival announced, with a firework",
      "White messages, no chat cooldown", "Gadgets of your own: bat blaster, explosive sheep, disco ball",
      "A free XP booster every day (x2 XP for 30 minutes; bought ones: x3)",
      "Host events for the server: /host (Sumo, Brackets, LMS)",
      "The rarest kill effects and victory dances", "The first place in the queues", "Everything of VIP, its 3 cosmetics too"]
  vip:
    prefixe: "&b[VIP] "
    couleur: "&b"
    permissions: [rago.perk.chat, rago.perk.fly, rago.perk.join, rago.perk.speed, rago.cosmetic.trail-clouds,
      rago.cosmetic.kill-hearts, rago.cosmetic.win-hearts]
    boost-xp: 1.25
    style: aqua
    boutique-en-ligne: true
    prix-en-ligne: "$4.99"
    prix-cadeau: 25000
    priorite-file: 1
    icone: DIAMOND
    avantages: ["A light blue name and the &b[VIP]&7 tag", "+25% Network XP in every game", "/fly in the lobby",
      "Speed I, II or III in the lobby (settings)", "Your arrival announced, with a firework", "White messages, no chat cooldown",
      "Priority in the queues (after PREMIUM+)", "3 cosmetics: the Clouds trail,", "the Heart burst kill, the Love win"]
# The colours of name and the badges (/style). A colour is a gradient along the letters of the
# name, made of the 16 colours of 1.8 (degrade: the colour characters from the first letter to the
# last, 0 to 9 and a to f: "5ddfd" goes from purple to pink to white; one character for one colour);
# gras: true for a bold name. Above the head a name takes one colour: the middle one. A badge is a
# short word after the name (texte, 15 characters at most with its colour codes). obtention says
# how a player gets it: premium (with a rank whose style or badge it is), achat (the web store
# gives it: /style give <player> couleur-feu, from the console), niveau (a reward of the Network
# levels, niveau.recompenses), points (bought in /style for prix Rago Points). A gradient is
# animated: its colours run along the name in the tab list only (about three times a second);
# above the head the name keeps one fixed colour, the middle of the gradient (anime: false for a
# fixed gradient). A player wears one colour and one badge at a time.
styles:
  couleurs:
    rose: {nom: "Pink", degrade: "5ddfd", obtention: premium}
    feu: {nom: "Fire", degrade: "4c6e", obtention: achat}
    ocean: {nom: "Ocean", degrade: "19b3", obtention: achat}
    foret: {nom: "Forest", degrade: "2ae", obtention: achat}
    coucher: {nom: "Sunset", degrade: "5dc6e", obtention: achat}
    glace: {nom: "Ice", degrade: "fb3b", obtention: achat}
    galaxie: {nom: "Galaxy", degrade: "159d", obtention: achat}
    arc-en-ciel: {nom: "Rainbow", degrade: "c6eab9d", obtention: achat}
    ombre: {nom: "Shadow", degrade: "0878", obtention: achat}
    aqua: {nom: "Aqua", degrade: "b", obtention: niveau}
    or: {nom: "Gold", degrade: "6", obtention: niveau}
    legende: {nom: "Legend", degrade: "6eef6", gras: true, obtention: niveau}
    rouge: {nom: "Red", degrade: "c", obtention: points, prix: 3000}
    vert: {nom: "Green", degrade: "a", obtention: points, prix: 3000}
    bleu: {nom: "Blue", degrade: "9", obtention: points, prix: 3000}
    jaune: {nom: "Yellow", degrade: "e", obtention: points, prix: 3000}
    violet: {nom: "Purple", degrade: "5", obtention: points, prix: 3000}
    blanc: {nom: "White", degrade: "f", obtention: points, prix: 3000}
    cerise: {nom: "Cherry", degrade: "c4", anime: false, obtention: points, prix: 6000}
    menthe: {nom: "Mint", degrade: "ab", anime: false, obtention: points, prix: 6000}
  badges:
    premium: {nom: "Premium", texte: "&d&l✦", obtention: premium}
    rago: {nom: "RAGO", texte: "&c&lRAGO", obtention: achat}
    better: {nom: "BETTER", texte: "&6&lBETTER", obtention: achat}
    pvp: {nom: "PVP", texte: "&4&lPVP", obtention: achat}
    yt: {nom: "YT", texte: "&c&lYT", obtention: achat}
    centurion: {nom: "Centurion", texte: "&e&l✫100", obtention: niveau}
  # The colours of the + of [PREMIUM+] (white without one): couleur, one colour character.
  plus:
    noir: {nom: "Black", couleur: "0", obtention: points, prix: 50000}
    jaune: {nom: "Yellow", couleur: "e", obtention: niveau}
    vert: {nom: "Green", couleur: "a", obtention: niveau}
    aqua: {nom: "Aqua", couleur: "b", obtention: niveau}
    rouge: {nom: "Red", couleur: "c", obtention: niveau}
    or: {nom: "Gold", couleur: "6", obtention: niveau}
    bleu: {nom: "Blue", couleur: "9", obtention: niveau}

# The ELO of the ranked modes, by division as on the Ranked Bedwars servers: everyone starts at 0,
# a division from its elo up to the next one's. A win gives "victoire" ELO and a loss takes
# "defaite", set by the player's division: much to win and little to lose at the bottom, the
# other way round at the top. The MVP of a game (the most kills) gets bonus-mvp more, won or lost.
# The ELO never goes below 0.
elo:
  bonus-mvp: 5
  divisions:
    Coal: {couleur: "&8", elo: 0, victoire: 35, defaite: 5}
    Iron: {couleur: "&f", elo: 100, victoire: 30, defaite: 10}
    Gold: {couleur: "&6", elo: 200, victoire: 30, defaite: 15}
    Diamond: {couleur: "&b", elo: 300, victoire: 25, defaite: 15}
    Emerald: {couleur: "&2", elo: 400, victoire: 25, defaite: 20}
    Sapphire: {couleur: "&3", elo: 500, victoire: 20, defaite: 20}
    Ruby: {couleur: "&4", elo: 600, victoire: 20, defaite: 25}
    Crystal: {couleur: "&d", elo: 700, victoire: 15, defaite: 25}
    Opal: {couleur: "&9", elo: 800, victoire: 15, defaite: 30}
    Amethyst: {couleur: "&5", elo: 900, victoire: 10, defaite: 30}
    Obsidian: {couleur: "&0", elo: 1000, victoire: 10, defaite: 35}

# The ranked season (/season), as on the Ranked Bedwars servers: a new numero starts every ranked
# ELO again from 0 (change it, then restart the server). The best ELO each player reached in the
# season that ended stays in their profile, and its division gives the Rago Points of recompenses
# at their next arrival (once). nom: shown to the players (default "Season <numero>"); fin: the
# last day of the season (2027-01-31), shown with the days left (it changes nothing by itself).
saison:
  numero: 2
  nom: "Season 2"
  fin: ""
  recompenses: {Coal: 0, Iron: 250, Gold: 500, Diamond: 1000, Emerald: 1500, Sapphire: 2000, Ruby: 3000, Crystal: 4000,
    Opal: 5000, Amethyst: 7500, Obsidian: 10000}

# The Rago Points, spent in the shop: for a win, a game played (lost), a kill, each new level
# (the level times par-niveau: 100 for level 10), and the daily reward (/daily): quotidien, plus
# quotidien-serie for each day in a row, up to 7 days. The trainings, the practice, the aim
# trainer and the events give one point for each xp-par-point Network XP they give (at least one;
# 0: none). A coin booster (x3) multiplies the points of the games, kills and trainings.
rago-points:
  victoire: 20
  defaite: 5
  kill: 2
  par-niveau: 10
  quotidien: 100
  quotidien-serie: 25
  xp-par-point: 3

# The cosmetics of the shop: projectile trails, kill effects and victory effects. Each one has a
# price in Rago Points and a Network level needed, which can be changed here by its name:
#   trail-clouds, trail-flames, trail-hearts, trail-emeralds, trail-notes, trail-magic,
#   trail-ender, trail-redstone, kill-blood, kill-hearts, kill-flames, kill-lightning,
#   kill-firework, kill-explosion, win-hearts, win-fireworks, win-flames, win-party
# for example:
#   trail-flames: {prix: 1000, niveau: 1}
boutique: {}

# The starter pack, the cheapest thing sold on the web store (lien), once per player: the store
# gives it from the console with /pack give <player> after the payment. The Shop NPC and /pack
# show it and its price (prix, in devise). prix-normal: a price it was really sold at before,
# shown crossed out with the saving (-25%...), or the same as prix for none (a price shown crossed
# out must be one the pack was really sold at). It gives rago-points, boosters (x3 XP for 30
# minutes each), boosters-pieces (x3 Rago Points for 30 minutes each) and the cosmetics of
# cosmetiques (names of the boutique: list above), without their level. No rank: VIP and
# PREMIUM+ are sold on their own (rang: vip would add one, for good).
pack-depart:
  nom: "&6&lStarter Pack"
  prix: 3.99
  prix-normal: 3.99
  devise: "€"
  rago-points: 20000
  boosters: 3
  boosters-pieces: 2
  cosmetiques: [trail-magic, kill-firework, win-fireworks]
  lien: "https://rago-optimizer.com"

# The chat: players without a rank wait delai-secondes between two messages, and cannot send the
# same message twice in a row (bloquer-repetition). The ranks with rago.perk.chat and the staff
# have neither.
chat:
  delai-secondes: 2
  bloquer-repetition: true

# The header and footer of the tab list (4 lines each at most): {joueurs} the players online,
# {ping} the player's ping.
tab:
  haut:
    - "&bYou are playing on &e&lRAGO.GG"
    - ""
  bas:
    - ""
    - "&a{joueurs} players online &8- &7Ping: &f{ping} ms"
    - "&aRanks, Rago Points & MORE! &c&l/SHOP"

# The message under the server's name in the server list (2 lines).
motd:
  - "&b&lRAGO PRACTICE &7- &f1.8 PvP & Ranked Bedwars"
  - "&eRanks, shop and ranked ELO divisions!"

