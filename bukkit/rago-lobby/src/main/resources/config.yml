# RagoLobby : le lobby principal de Rago Practice. Mode d'emploi : le README du module.

# Le monde du lobby. S'il n'existe pas, le plugin le crée : un monde vide avec une petite
# plateforme. Pour utiliser ta map, mets ici le nom de son monde (par exemple celui donné à
# /monde importer), puis /lobby setspawn à l'endroit voulu.
monde: lobby

# Sous cette hauteur, un joueur qui tombe du lobby revient au spawn.
hauteur-vide: 0

# Le scoreboard du lobby : son titre (32 caractères au plus) et sa dernière ligne.
titre: "&b&lRAGO PRACTICE"
adresse: "&7rago.gg"

# Les files d'attente. Tant que la base de données n'existe pas, tout le monde a le même ELO.
# En classé, l'écart d'ELO accepté commence à ecart-elo-initial et grandit de ecart-elo-pas
# toutes les ecart-elo-secondes d'attente, jusqu'à ecart-elo-max.
file:
  elo-par-defaut: 1000
  ecart-elo-initial: 100
  ecart-elo-pas: 50
  ecart-elo-secondes: 10
  ecart-elo-max: 500

# Les catégories du sélecteur, une par zone du lobby, dans l'ordre du menu (7 au plus) : de gauche
# à droite comme dans le lobby. La boussole
# montre d'abord les catégories, puis les modes de celle qu'on choisit (28 au plus par catégorie).
# Sans section categories, la boussole montre tous les modes d'un coup (35 au plus).
categories:
  duels:
    nom: "&a&lDuels"
    icone: IRON_SWORD
    description:
      - "Sumo, épée, boxing, fireball,"
      - "attack and defense, top fight..."
  ranked:
    nom: "&6&lRanked Bedwars"
    icone: BED
    description:
      - "Le classé et les modes Bedwars :"
      - "ranked, partie privée, FFA,"
      - "first rush, end game..."
  entrainement:
    nom: "&b&lEntraînement"
    icone: SANDSTONE
    description:
      - "Seul ou contre un bot : clutch,"
      - "block in, fast defense, bridge..."

# Les PNJ du lobby. Chacun se tient sur un point placé par /lobby point <nom> (la clé) et ouvre
# ses modes : un clic rejoint la file s'il n'en a qu'un, sinon ouvre un menu de ses modes.
# Un PNJ dont le point n'est pas encore placé n'apparaît pas.
pnj:
  rankedbedwars1v1ou2v2elo:
    nom: "&6&lRanked Bedwars"
    modes: [ranked-1v1, ranked-2v2]
  privategame:
    nom: "&6Partie privée"
    modes: [partie-privee]
  rbwffa:
    nom: "&cFFA Ranked Bedwars"
    modes: [ffa]
  rbwsolo1v1ou2v2skyrise:
    nom: "&6End game"
    modes: [end-game-1v1, end-game-2v2]
  firstrushnebucgelatosoloduo:
    nom: "&eFirst rush"
    modes: [first-rush]
  invispracticearwhayinvasion:
    nom: "&5Invis practice"
    modes: [invis-practice]
  realisticplat:
    nom: "&bBridge fight"
    modes: [bridge-fight]
  freearenacombo:
    nom: "&fArène libre"
    modes: [arene-libre]
  blockplacementarena:
    nom: "&bBlock placement"
    modes: [block-fight-1v1, block-fight-2v2]
  attackdefenseversionrbw:
    nom: "&cAttack and defense"
    modes: [attack-defense-1v1, attack-defense-2v2]
  boxingcombo:
    nom: "&fBoxing"
    modes: [boxing]
  fireballfight:
    nom: "&cFireball fight"
    modes: [fireball]
  blockclutchpractice:
    nom: "&bBlock clutch"
    modes: [clutch]
  blockinpractice:
    nom: "&bBlock in"
    modes: [block-in]
  fastdefensepractice:
    nom: "&bFast defense"
    modes: [fast-defense]
  bridgepractice:
    nom: "&bBridge au chrono"
    modes: [bridge-chrono]
  kbdisplacepractice:
    nom: "&bKB displace"
    modes: [kb-displace, kb-displace-bot]
  ladderpractice:
    nom: "&6Ladder practice"
    modes: [ladder-practice]
  pearlpractice:
    nom: "&5Pearl practice"
    modes: [pearl-practice]
  fastshoppractice:
    nom: "&aShop buyer"
    modes: [shop-practice]

# Les classements du lobby, sur leur point : le titre affiché. Leur contenu viendra avec les
# statistiques.
classements:
  leaderboardprincipal: "&e&lClassement Ranked"

# Les modes, dans l'ordre du sélecteur. L'identifiant (la clé) ne contient que des minuscules sans
# accent, des chiffres et des tirets. Un mode reste « Bientôt » dans le sélecteur tant qu'aucun
# plugin de jeu ne le prend en charge.
#   nom                le nom affiché (codes de couleur avec &)
#   icone              l'objet affiché dans le sélecteur (nom d'objet de Minecraft 1.8)
#   equipes            le nombre d'équipes d'une partie
#   joueurs-par-equipe le nombre de joueurs de chaque équipe
#   categorie          la catégorie du mode (une de categories: ci-dessus)
#   classe             true pour un mode classé (ELO)
#   description        les lignes sous le nom
modes:
  ranked-1v1:
    nom: "&6Ranked Bedwars 1v1"
    categorie: ranked
    icone: BED
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    description:
      - "Bedwars classé en 1v1,"
      - "sur Invasion ou Lectus :"
      - "ton ELO monte ou descend"
      - "à chaque partie."
  ranked-2v2:
    nom: "&6Ranked Bedwars 2v2"
    categorie: ranked
    icone: DIAMOND_SWORD
    equipes: 2
    joueurs-par-equipe: 2
    classe: true
    description:
      - "Bedwars classé à deux contre"
      - "deux, sur Invasion ou Lectus."
