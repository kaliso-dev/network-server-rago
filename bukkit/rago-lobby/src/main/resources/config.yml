    # The crown of the top 3 of the leaderboards of the week (semaine:), until the next results.
    semaine: {nom: "Top of the week", texte: "&6&l♛", obtention: semaine}
  # The colours of the + of [PREMIUM+] (white without one): couleur, one colour character.
