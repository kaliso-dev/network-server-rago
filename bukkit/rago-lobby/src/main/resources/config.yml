  #   skin: ranked
  #   modes: [ranked-1v1, ranked-2v2, ranked-3v3, ranked-4v4]
  # ffa:
  #   nom: "&cFFA and Top bridge"
  #   skin: ffa
  #   modes: [ffa, top-bridge-1v1, top-bridge-2v2, top-bridge-ffa]
  # clutchscenario:
  #   nom: "&6Clutch Scenario"
  #   skin: clutch
  #   modes: [clutch-scenario-1v1, clutch-scenario-2v2, clutch-scenario-3v3, clutch-scenario-4v4]
  # attackanddefense:
  #   nom: "&6Attack and Defense"
  #   skin: attaque
  #   modes: [attack-defense-1v1, attack-defense-2v2]
  # rbwsolo1v1ou2v2skyrise:
  #   nom: "&6RBW Sky Rise"
  #   skin: skyrise
  #   modes: [skyrise-1v1, skyrise-2v2]
  # firstrushnebucgelatosoloduo:
  #   nom: "&6First rush"
  #   skin: rush
  #   modes: [first-rush, first-rush-duo]
  # invispracticearwhayinvasion:
  #   nom: "&6Invis practice"
  #   skin: invis
  #   modes: [invis-practice]
  # realisticplat:
  #   nom: "&aBridge fight"
  #   skin: bridge
  #   modes: [bridge-fight, bridge-fight-1v1, bridge-fight-2v2]
  # blockplacementarena:
  #   nom: "&aBlock placement"
  #   skin: blocs
  #   modes: [block-fight-1v1, block-fight-2v2, block-fight-arena]
  # The NPCs of the side zones, on their front sign, if you want them there too:
  # attackdefenseversionrbw:
  #   nom: "&a&lDuels"
  #   categorie: duels
