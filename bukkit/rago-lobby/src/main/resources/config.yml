    classe: false
    description:
      - "Seul : clutch simple, double"
      - "clutch, extend... Tu prends"
      - "un coup, pose tes blocs pour"
      - "te sauver."
  block-fight-1v1:
    nom: "&bBlock placement 1v1"
    icone: SANDSTONE
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    description:
      - "Pose tes blocs plus vite"
      - "que l'autre pour gagner."
  block-fight-2v2:
    nom: "&bBlock placement 2v2"
    icone: SANDSTONE
    equipes: 2
    joueurs-par-equipe: 2
    classe: false
    description:
      - "Block placement à deux"
      - "contre deux."
  top-fight-1v1:
    nom: "&eTop fight 1v1"
    icone: GOLD_SWORD
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    description:
      - "Un duel Top fight."
  top-fight-2v2:
    nom: "&eTop fight 2v2"
