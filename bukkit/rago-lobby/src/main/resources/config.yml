# The ELO of the ranked modes, by division as on the Ranked Bedwars servers: everyone starts at 0,
# a division from its elo up to the next one's. A win gives "victoire" ELO and a loss takes
# "defaite", set by the player's division: much to win and little to lose at the bottom, the
# other way round at the top. The MVP of a game (the most kills) gets bonus-mvp more, won or lost.
# The ELO never goes below 0.
elo:
  bonus-mvp: 5
  divisions:
    Coal: {couleur: "&8", elo: 0, victoire: 35, defaite: 5}
    Iron: {couleur: "&f", elo: 100, victoire: 30, defaite: 10}
    Gold: {couleur: "&6", elo: 200, victoire: 30, defaite: 15}
    Diamond: {couleur: "&b", elo: 300, victoire: 25, defaite: 15}
    Emerald: {couleur: "&2", elo: 400, victoire: 25, defaite: 20}
    Sapphire: {couleur: "&3", elo: 500, victoire: 20, defaite: 20}
    Ruby: {couleur: "&4", elo: 600, victoire: 20, defaite: 25}
    Crystal: {couleur: "&d", elo: 700, victoire: 15, defaite: 25}
    Opal: {couleur: "&9", elo: 800, victoire: 15, defaite: 30}
    Amethyst: {couleur: "&5", elo: 900, victoire: 10, defaite: 30}
    Obsidian: {couleur: "&0", elo: 1000, victoire: 10, defaite: 35}

# The ranked season (/season), as on the Ranked Bedwars servers: a new numero starts every ranked
# ELO again from 0 (change it, then restart the server). The best ELO each player reached in the
# season that ended stays in their profile, and its division gives the Rago Points of recompenses
# at their next arrival (once). nom: shown to the players (default "Season <numero>"); fin: the
# last day of the season (2027-01-31), shown with the days left (it changes nothing by itself).
saison:
  numero: 2
  nom: "Season 2"
  fin: ""
  recompenses: {Coal: 0, Iron: 250, Gold: 500, Diamond: 1000, Emerald: 1500, Sapphire: 2000, Ruby: 3000, Crystal: 4000,
    Opal: 5000, Amethyst: 7500, Obsidian: 10000}

# The Rago Points, spent in the shop: for a win, a game played (lost), a kill, each new level
# (the level times par-niveau: 100 for level 10), and the daily reward (/daily): quotidien, plus
# quotidien-serie for each day in a row, up to 7 days. The trainings, the practice, the aim
# trainer and the events give one point for each xp-par-point Network XP they give (at least one;
# 0: none). A points booster (x3) multiplies the points of the games, kills and trainings.
rago-points:
  victoire: 20
  defaite: 5
  kill: 2
  par-niveau: 10
  quotidien: 100
  quotidien-serie: 25
  xp-par-point: 3

# The cosmetics of the shop: projectile trails, kill effects and victory effects. Each one has a
# price in Rago Points and a Network level needed, which can be changed here by its name:
#   trail-clouds, trail-flames, trail-hearts, trail-emeralds, trail-notes, trail-magic,
#   trail-ender, trail-redstone, kill-blood, kill-hearts, kill-flames, kill-lightning,
#   kill-firework, kill-explosion, win-hearts, win-fireworks, win-flames, win-party
# for example:
#   trail-flames: {prix: 1000, niveau: 1}
boutique: {}

# The starter pack, the cheapest thing sold on the web store (lien), once per player: the store
# gives it from the console with /pack give <player> after the payment. The Shop NPC and /pack
# show it and its price (prix, in devise). prix-normal: a price it was really sold at before,
# shown crossed out with the saving (-25%...), or the same as prix for none (a price shown crossed
# out must be one the pack was really sold at). It gives rago-points, boosters (x3 XP for 30
# minutes each), boosters-pieces (x3 Rago Points for 30 minutes each) and the cosmetics of
# cosmetiques (names of the boutique: list above), without their level. No rank: VIP and
# PREMIUM+ are sold on their own (rang: vip would add one, for good).
pack-depart:
  nom: "&6&lStarter Pack"
  prix: 3.99
  prix-normal: 3.99
  devise: "€"
  rago-points: 20000
  boosters: 3
  boosters-pieces: 2
  cosmetiques: [trail-magic, kill-firework, win-fireworks]
  lien: "https://rago-optimizer.com"

# The chat: players without a rank wait delai-secondes between two messages, and cannot send the
# same message twice in a row (bloquer-repetition). The ranks with rago.perk.chat and the staff
# have neither.
chat:
  delai-secondes: 2
  bloquer-repetition: true

# The header and footer of the tab list (4 lines each at most): {joueurs} the players online,
# {ping} the player's ping. In the colours of the server (README: Les couleurs du serveur): its
# name in red, the slogan, rago.gg in red at the bottom.
tab:
  haut:
    - "&c&lRAGO PRACTICE"
    - "&7Train. Clutch. Climb."
    - ""
  bas:
    - ""
    - "&f{joueurs} &7players online &8• &7Ping: &f{ping} ms"
    - "&7Ranks, Rago Points & more: &c/shop"
    - "&crago.gg"

# The message under the server's name in the server list: 2 lines of about 270 pixels each (a
# letter is 6, a space 4, 1 more in bold; longer, the first line wraps and hides the second). The
# first says what the server is; the second, NEW in red then what is new: change it at each update.
motd:
  - "&cRAGO PRACTICE &8• &fBed Wars Practice, Ranked & Duels"
  - "&c&lNEW &8» &fHypixel knockback, prestiges & season badges"

# The tips told to the lobby, one every "minutes", in turn. One prefix for the server's messages:
# RAGO in bold red, then » in dark grey; short lines in English, starting with a verb.
annonces:
  minutes: 5
  messages:
    - "&c&lRAGO &8» &fEarn Rago Points in every game, spend them in the &c/shop&f."
    - "&c&lRAGO &8» &fClaim your daily reward with &c/daily&f: days in a row give more."
    - "&c&lRAGO &8» &fAdd your friends with &c/friend add&f, play together in a &c/party&f."
    - "&c&lRAGO &8» &fClimb the ranked divisions, from Coal to Obsidian: &c/top elo&f."
    - "&c&lRAGO &8» &fRead the news and the store on &crago-optimizer.com&f."
    - "&c&lRAGO &8» &fPick ranks, cosmetics and the colour of your &d+&f in the &c/shop&f."
    - "&c&lRAGO &8» &fGo &d[PREMIUM+]&f: +50% XP, /fly, the &d+&f and gadgets of its own on &crago-optimizer.com&f."
    - "&c&lRAGO &8» &fGet Rago Optimizer on &crago-optimizer.com&f."
    - "&c&lRAGO &8» &fPlay any game for Rago Points, spend them in the &c/shop&f."
    - "&c&lRAGO &8» &fDownload Rago Optimizer and read its news: &crago-optimizer.com&f."
    - "&c&lRAGO &8» &fGrab the &6Starter Pack&f: 20,000 Rago Points, 5 boosters and 3 cosmetics for 3.99€: &c/pack"
    - "&c&lRAGO &8» &fHost Sumo, Brackets and LMS for the whole server with &d[PREMIUM+]&f: &c/host"

# What /discord, /site, /rules and /store show (one line or a list).
liens:
  discord: "&c&lRAGO &8» &fJoin our Discord: &cdiscord.gg/ragooptimizer"
  site: "&c&lRAGO &8» &fOur website: &crago-optimizer.com"
  boutique: "&c&lRAGO &8» &fThe store: &crago-optimizer.com"
  regles:
    - "&c&lRules"
    - "&71. No cheats, macros or unfair mods."
    - "&72. No insults, spam or advertising."
    - "&73. No teaming in solo modes, no boosting."
    - "&74. Respect the staff: their word is final."

# The billboards of the lobby: an image of yours on a wall of maps in item frames, as on Hypixel
# (your YouTube channel, the Discord, the store...). Each block of the wall is a map of 128 x 128
# pixels: a board of 8 x 8 blocks shows 1024 x 1024 pixels, one of 16 x 9 blocks 2048 x 1152 (a
# 1920 x 1080 image fills it). The image is brought to the colours a 1.8 client draws on maps,
# with dots of near colours (dithering) for the gradients, and shows whole, centred, black around
# it if its shape is not the board's. The players see a board from 128 blocks away.
#   image     the file in plugins/RagoLobby/panneaux/ (PNG or JPG), read at the start
#   largeur   its width in blocks (1 to 16)
#   hauteur   its height in blocks (1 to 16)
#   lieu      "x y z": the block of the middle of its bottom row (just right of the middle for an
#             even width, as seen from in front), the board facing the spawn; "x y z nord" (sud, est,
#             ouest) to face that way. In the game instead: stand there, look where it is seen from
#             and type /lobby point panneau-<name>; that point wins over lieu.
# 8 billboards at most, by name (lowercase letters, digits and dashes), for example:
#   discord: {image: discord.png, largeur: 8, hauteur: 8, lieu: "0 70 40"}
panneaux: {}

# The leaderboard walls, on their point: boards side by side, facing the spawn, the first on the
# left. Each one shows the top 10, the player's place and when it resets.
#   nom       the title above the wall (optional)
#   tableaux  from 1 to 5 of:
#     victoires  the wins, all modes together
#     parties    the games played
#     series     the best win streak
#     kills      the kills (in a sumo: knocking the other one off)
#     fkdr       the final kills / final deaths of Bed Wars, ever (the final kills alone without a
#                final death)
#     niveau     the Network level
#     elo        the ELO of a ranked mode
# A click on a board changes its period (daily, weekly, lifetime) for the one who clicks; on an elo
# board, it changes the ranked mode (1v1, 2v2, 3v3, 4v4); niveau and fkdr have one board.
# A board can group several leaderboards in brackets, for example [elo, kills, niveau]: a click on
# it goes to the next one, a click on its last line changes the period or the ranked mode.
#   podium    the steps of a podium (optional, up to 5, the first place first): on each one stands
#             the player at that place of the first board, in their skin, with their name and score
#             above. Each player sees the top of what they read on the board (ELO, kills or level,
#             the period, the ranked mode). A step is a /lobby point, or "x y z": where the feet of
#             who stands on it go. A click on a step opens that player's stats.
#   periode   jour, semaine or toujours: the boards of the wall stay on that period (a click only
#             goes to the next leaderboard of a board). Left out, each player chooses it.
# A board of the week says, under the player's place, what its top wins on Monday (semaine:).
classements:
  top:
    nom: "&c&lTop players"
    # The Network level first (and on the podium); a click goes to the ELO, the FKDR, the kills,
    # then the games played.
    tableaux: [[niveau, elo, fkdr, kills, parties]]
    # The podium: the top 3 of the board, in their skin. Stand on each step and type /lobby point
    # top1 (the first), top2, then top3.
    podium: [top1, top2, top3]
  leaderboards:
    nom: "&c&lLeaderboards"
    tableaux: [victoires, series, parties]
  # The kills in the middle (on the point), the win streaks on the left, the Network level on the right.
  joueurs:
    nom: "&c&lPlayer leaderboards"
    tableaux: [series, kills, niveau]
  # The wall of the week: its boards stay on this week and show what their top 3 wins on Monday
  # (semaine: below). Place it with /lobby point semaine where it is seen from the spawn.
  semaine:
    nom: "&c&lThis week"
    periode: semaine
    tableaux: [victoires, series, [kills, parties]]
    # The podium in front of it: the top 3 of the wins of the week, in their skin. Stand on each
    # step and type /lobby point semaine1 (the first), semaine2, then semaine3.
    podium: [semaine1, semaine2, semaine3]

# The leaderboards of the week: on Monday at midnight (Paris time), the first of each one win
# Rago Points and the badge of the week, worn until the next results, and the whole server hears
# it (the winners away hear it when they come back).
#   classements  the leaderboards of the week rewarded, every mode together: victoires, series,
#                kills, parties. The biggest clutches of the week of the practice come with them.
#   points       the Rago Points of the first, the second, the third... (10 places at most)
#   badge        the badge of styles.badges they wear for the week ("" for none). A player who
#                chose a badge in /style keeps theirs.
#   actif        false: no rewards.
semaine:
  classements: [victoires, series, kills, parties]
  points: [2000, 1000, 500]
  badge: semaine

# The titles of the modes, earned with wins ("Sumo Gold III"), nothing to pay: each title counts
# the wins of its modes together and climbs the steps one after the other, five levels each (I to
# V). A player wears their best one in the chat (before their rank) and their profile, and above
# their name if they choose it; /titles shows them all, and wears another one or none. A new title
# or level is told after the win.
#   paliers   the steps in order, by name (12 characters at most): couleur (of the title), depart
#             (the wins of level I) and pas (the wins between two levels): Gold from 200 by 50 is
#             Gold I at 200 wins, Gold II at 250... Gold V at 400. A step starts after the level V
#             of the one before.
#   familles  the titles (28 at most), by key: nom (what the players read, 20 characters at most)
#             and modes (the ids of the modes whose wins count). The ranked modes have their ELO
#             divisions instead.
#   actif     false: no titles.
titres:
  paliers:
    Bronze: {couleur: "&6", depart: 10, pas: 10}
    Silver: {couleur: "&7", depart: 75, pas: 25}
    Gold: {couleur: "&e", depart: 200, pas: 50}
    Platinum: {couleur: "&3", depart: 500, pas: 100}
    Diamond: {couleur: "&b", depart: 1000, pas: 200}
    Master: {couleur: "&2", depart: 2000, pas: 500}
    Legend: {couleur: "&5", depart: 5000, pas: 1000}
    Mythic: {couleur: "&d", depart: 10000, pas: 2500}
  familles:
    sky-rise: {nom: "Sky Rise", modes: [skyrise-1v1, skyrise-2v2, skyrise-resources-1v1, skyrise-resources-2v2]}
    first-rush: {nom: "First Rush", modes: [first-rush, first-rush-duo, first-rush-full, first-rush-full-duo]}
    bed-fight: {nom: "Bed Fight", modes: [bed-fight-1v1, bed-fight-2v2, top-bed-fight-1v1]}
    top-bridge: {nom: "Top Bridge", modes: [top-bridge-1v1, top-bridge-2v2, top-bridge-ffa]}
    clutch-scenario: {nom: "Clutch Scenario", modes: [clutch-scenario-1v1, clutch-scenario-2v2, clutch-scenario-3v3,
      clutch-scenario-4v4]}
    attack-defense: {nom: "Attack Defense", modes: [attack-defense-1v1, attack-defense-2v2]}
    invis: {nom: "Invis", modes: [invis-practice]}
    bed-break: {nom: "Bed Break", modes: [bed-break-simulator]}
    sumo: {nom: "Sumo", modes: [sumo]}
    boxing: {nom: "Boxing", modes: [boxing]}
    kb-displace: {nom: "KB Displace", modes: [kb-displace]}
    block-placement: {nom: "Block Placement", modes: [block-fight-1v1, block-fight-2v2]}
    bridge-fight: {nom: "Bridge Fight", modes: [bridge-fight-1v1, bridge-fight-2v2]}
    block-edit: {nom: "Block Edit", modes: [block-edit-duel]}
    fireball: {nom: "Fireball Fight", modes: [fireball]}
    bow: {nom: "Bow Duel", modes: [bow-duel]}

# The Hypixel import: players copy the quick buy of their Bed Wars shop and their hotbar manager
# from Hypixel, in one click (the emerald in the kit editor book) or with /hypixel import <name>,
# for the Bed Wars modes and Fast Shop. It asks the Hypixel API with the server's own key:
#   cle-api  the API key of your application on https://developer.hypixel.net ("" turns the
#            import off). Never share it, and never put it in a public repository: anyone with it
#            can use your limits. Each player can import once a minute.
hypixel:
  cle-api: ""

# The private games whose size follows the party: a party leader who clicks one of these modes
# starts a private game of the party against itself (in no stats), in the one of its modes made
# for the party's size: 2 players play the 1v1, 4 the 2v2, 6 the 3v3, 8 the 4v4. A player without
# a party is asked to make one (/party invite <name>).
parties-privees:
  partie-privee: [ranked-1v1, ranked-2v2, ranked-3v3, ranked-4v4]
  top-bridge-prive: [top-bridge-1v1, top-bridge-2v2]

# The modes, in the order of the selector. The id (the key) holds only lowercase letters without
# accents, digits and dashes. A mode stays "Coming soon" in the selector until a game plugin
# hosts it.
#   nom                the name shown (colour codes with &)
#   icone              the item shown in the selector (a Minecraft 1.8 item name)
#   equipes            the number of teams in a game
#   joueurs-par-equipe the number of players in each team
#   categorie          the category of the mode (one of categories: above)
#   groupe             the group of the mode in its category (one of groupes: above), if any
#   cache              true: not in the selector, played only through a private game
#   classe             true for a ranked mode (ELO)
#   description        the lines under the name
#   kit                the items the mode gives, which players arrange as they like with the kit
#                      editor (the book of the lobby hotbar). A list: the first item goes in the
#                      first hotbar slot, and so on ("" for an empty slot); slots 0 to 8 are the
#                      hotbar, 9 to 35 the inventory, from the top row. An item is ITEM, ITEM amount
#                      or ITEM:data amount, for example IRON_SWORD, "WOOL 64", "WOOL:14 64" (red).
#                      Or slot: item lines:
#                        kit:
#                          0: IRON_SWORD
#                          8: "ENDER_PEARL 2"
#                      The kits below are examples, to adjust: their modes have no game yet. The
#                      sumo has none (bare hands); give it one, a stick for example, to try the
#                      editor in a duel.
modes:
  ranked-1v1:
    nom: "&6Ranked Bedwars 1v1"
    categorie: ranked
    groupe: ranked
    icone: BED
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    description:
      - "Ranked Bedwars in 1v1,"
      - "on the 20 maps of the RBW"
      - "queue: your ELO goes up or"
