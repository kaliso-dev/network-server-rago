    - "&71. No cheats, macros or unfair mods."
    - "&72. No insults, spam or advertising."
    - "&73. No teaming in solo modes, no boosting."
    - "&74. Respect the staff: their word is final."

# The leaderboard walls, on their point: boards side by side, facing the spawn, the first on the
# left. Each one shows the top 10, the player's place and when it resets.
#   nom       the title above the wall (optional)
#   tableaux  from 1 to 5 of:
#     victoires  the wins, all modes together
#     parties    the games played
#     series     the best win streak
#     kills      the kills (in a sumo: knocking the other one off)
#     fkdr       the final kills / final deaths of Bed Wars, ever (the final kills alone without a
#                final death)
#     niveau     the Network level
#     elo        the ELO of a ranked mode
# A click on a board changes its period (daily, weekly, lifetime) for the one who clicks; on an elo
# board, it changes the ranked mode (1v1, 2v2, 3v3, 4v4); niveau and fkdr have one board.
# A board can group several leaderboards in brackets, for example [elo, kills, niveau]: a click on
# it goes to the next one, a click on its last line changes the period or the ranked mode.
#   podium    the steps of a podium (optional, up to 5, the first place first): on each one stands
#             the player at that place of the first board, in their skin, with their name and score
#             above. Each player sees the top of what they read on the board (ELO, kills or level,
#             the period, the ranked mode). A step is a /lobby point, or "x y z": where the feet of
#             who stands on it go. A click on a step opens that player's stats.
classements:
  leaderboardprincipal:
    nom: "&e&lTop players"
    # The Network level first (and on the podium); a click goes to the ELO, the FKDR, the kills,
    # then the games played.
    tableaux: [[niveau, elo, fkdr, kills, parties]]
    # The podium behind the board: the emerald (1st), the diamond (2nd), the gold block (3rd).
    podium: ["0.5 67 57.5", "-1.5 66 57.5", "2.5 65 57.5"]
  leaderboardstats:
    nom: "&e&lLeaderboards"
    tableaux: [victoires, series, parties]
  # The kills in the middle (on the point), the win streaks on the left, the Network level on the right.
  leaderboardplayer:
    nom: "&e&lPlayer leaderboards"
    tableaux: [series, kills, niveau]

# The Hypixel import: players copy the quick buy of their Bed Wars shop and their hotbar manager
# from Hypixel, in one click (the emerald in the kit editor book) or with /hypixel import <name>,
# for the Bed Wars modes and Fast Shop. It asks the Hypixel API with the server's own key:
#   cle-api  the API key of your application on https://developer.hypixel.net ("" turns the
