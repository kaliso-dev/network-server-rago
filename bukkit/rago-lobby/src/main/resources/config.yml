# RagoLobby: the main lobby of Rago Practice. How to use it: the README of the module.
# The keys stay in French (monde, titre, modes...): only the comments and the texts are English.

# The lobby world. If it does not exist, the plugin creates it: an empty world with a small
# platform. To use your map, put the name of its world here (for example the one given to
# /monde import), then /lobby setspawn where you want the spawn.
monde: lobby

# Below this height, a player who falls off the lobby goes back to the spawn.
hauteur-vide: 0

# The slime blocks of the lobby are launch pads, as on Hypixel: they throw whoever steps on them
# where they look, avant forward and haut up (blocks per tick, 0 to 4; avant: 0 and haut: 0 for
# plain slime blocks). 3.5 and 1.3 throw about 30 blocks away and 9 high (2.0 and 0.9: 16 and 5).
slime:
  avant: 3.5
  haut: 1.3

# The lobby scoreboard: its title (32 characters at most) and its last line.
titre: "&c&lRAGO PRACTICE"
adresse: "&crago.gg"

# The queues. A ranked queue matches players by their ELO (see elo: below), from
# elo-par-defaut before a player's first ranked game: the ELO gap accepted starts at
# ecart-elo-initial and grows by ecart-elo-pas every ecart-elo-secondes of waiting, up to
# ecart-elo-max. A player who leaves a ranked game they still play (/spawn, Play again, leaving
# the server) cannot join a ranked queue for abandon-classe-minutes (0 to 60, 0 for never), as on
# the ranked servers: not after a /duel nor a party's private game, which move no ELO.
file:
  elo-par-defaut: 0
  ecart-elo-initial: 100
  ecart-elo-pas: 50
  ecart-elo-secondes: 10
  ecart-elo-max: 500
  abandon-classe-minutes: 5

# After a won game (Bed Wars, a duel), the seconds everyone stays in the arena to see the winners
# and their victory effect, with the Play again paper and the Leave bed usable at once (and
# [PLAY AGAIN] [LEAVE] in the chat), before going back to the lobby: 0 to 10, 0 for at once.
fin-de-partie-secondes: 3

# Replays: the duels and the Bed Wars games are recorded, and /replay shows a player their last
# games (or any game by its code, /replay CODE; [REPLAY] at the end of a game). Kept "jours" days,
# within "taille-max-mo" MB (the oldest go first) in plugins/RagoLobby/replays: a few dozen KB
# for a duel, a few hundred for a Bed Wars game. spectateurs-max: replays watched at the same time.
# actif: false records nothing.
replays:
  actif: true
  jours: 3
  taille-max-mo: 2000
  spectateurs-max: 6

# The categories of the selector, one per zone of the lobby, in the order of the menu (7 at most):
# left to right, as in the lobby. The compass first shows the categories, then the games of the
# one picked (28 modes at most per category). Without a categories section, the compass shows
# every mode at once (35 at most). slogan: what a player does there, in a few words (40 characters
# at most, colours not counted): under its name in the compass, under its NPC, and in the welcome
# of the lobby; its key words in the colour of the category, the rest in grey (&7).
categories:
  entrainement:
    nom: "&b&lPractice"
    icone: SANDSTONE
    slogan: "&bTrain alone&7, at your &bown pace"
    description:
      - "Clutch, block in, fast defense,"
      - "bridging, extend, pearls, bow,"
      - "fireballs, aim, bots: one skill"
      - "at a time."
  ranked:
    nom: "&6&lRBW Modes"
    icone: BED
    slogan: "&6Ranked &7and &6RBW situations"
    description:
      - "Ranked 1v1 to 4v4, and modes"
      - "close to Ranked Bedwars: Sky"
      - "Rise, first rush, invis, clutch"
      - "scenarios, attack and defense,"
      - "Bed Break Simulator, private"
      - "games. With the server or your"
      - "friends."
  duels:
    nom: "&a&lDuels"
    icone: IRON_SWORD
    slogan: "&aDuel your friends &7or &aanyone"
    description:
      - "Bed fight, Top BedFight, top"
      - "bridge, bridge fight, block"
      - "placement in 1v1 or 2v2; Lobby"
      - "Fight, sumo, boxing, KB displace,"
      - "fireball fight, bow."
      - "/duel a player to challenge them."
  # the modes without a queue: in at once, with whoever is there
  arenes:
    nom: "&c&lArenas"
    icone: DIAMOND_SWORD
    slogan: "&cJump in &7and &cfight now"
    description:
      - "No queue, come and go when you"
      - "like: the FFA, Top Bridge FFA,"
      - "Lobby Fight FFA, bridge fight,"
      - "block placement arena and Arena"
      - "Free. Someone to fight at once."

# At each arrival in the lobby, the ways to play in the chat: a line per category (its name and
# slogan), a click opens its modes (/play category); at the first arrival, a title too. false: none.
accueil: true

# At the first arrival on the server, a menu "What do you want to do?": each choice a click away
# from playing, and Getting started (the quests of a new player) under them. Per choice: nom,
# icone, description, and mode (joins its queue, a training starts at once; while the mode is not
# played, its category opens) or categorie (opens that category). 7 at most. {}: no menu.
premiere-venue:
  entrainer:
    nom: "&bTrain a skill"
    icone: LADDER
    mode: clutch
    description:
      - "Start with the block clutch:"
      - "a hit throws you off, place"
      - "your wool to save yourself."
  ranked:
    nom: "&6Play Ranked Bedwars"
    icone: BED
    mode: ranked-1v1
    description:
      - "1v1 on the RBW maps, your ELO"
      - "from the first game. Train"
      - "while you wait."
  duel:
    nom: "&aDuel a friend"
    icone: IRON_SWORD
    categorie: duels
    description:
      - "/duel <player> challenges a"
      - "friend; or a duel with anyone:"
      - "sumo, boxing, bridge..."
  arenes:
    nom: "&cFight now"
    icone: DIAMOND_SWORD
    mode: ffa
    description:
      - "The FFA: no queue, in at once"
      - "with whoever is there."

# The groups: the sizes of one game (1v1, 2v2...), one item in their category which opens them
# side by side, as the games of Hypixel. A mode is in a group with groupe: (the modes of a group
# are of one category); the item shows where its first mode is in the list of the modes.
groupes:
  ranked:
    nom: "&6&lRanked Bedwars"
    icone: BED
    description:
      - "Ranked Bedwars on the 20 maps"
      - "of the RBW queue: your ELO goes"
      - "up or down after every game."
  skyrise:
    nom: "&6RBW Sky Rise"
    icone: DIAMOND_CHESTPLATE
    description:
      - "A Bedwars, RBW style,"
      - "on Sky Rise."
  first-rush:
    nom: "&6First rush"
    icone: IRON_PICKAXE
    description:
      - "A real Bedwars, RBW style, on"
      - "two islands side by side: the"
      - "first rush decides it."
  # the duels (category duels): each in 1v1 or 2v2; queued alone in a 2v2, a teammate is found
  # in the queue, and the lobby is told: "Name's team is queuing Bed fight 2v2 [JOIN NOW]"
  bed-fight:
    nom: "&aBed fight"
    icone: BED
    description:
      - "Two islands, a bed each: break"
      - "theirs and kill them. You come"
      - "back while your bed stands."
  top-bridge:
    nom: "&aTop Bridge"
    icone: LADDER
    description:
      - "The fight on the top bridge of"
      - "Antenna, on the 20 RBW maps:"
      - "rounds to 5 points in 1v1 or"
      - "2v2."
  clutch-scenario:
    nom: "&6Clutch scenario"
    icone: IRON_CHESTPLATE
    description:
      - "A real RBW game on Sky Rise"
      - "or Archway, bridges built:"
      - "one team has lost its bed,"
      - "iron armour, stone sword,"
      - "full forges. Clutch or defend."
  bridge-fight:
    nom: "&aBridge fight"
    icone: WOOL
    description:
      - "On a wool platform, no blocks:"
      - "a 1v1 or a 2v2, first to 5."
  block-placement:
    nom: "&aBlock placement"
    icone: SANDSTONE
    description:
      - "Build, clutch and fight on the"
      - "block placement maps: 1v1"
      - "or 2v2."
  prive:
    nom: "&6Private games"
    icone: NAME_TAG
    description:
      - "With your party: a real RBW"
      - "game or a top bridge, the size"
      - "follows the party."
  attack-defense:
    nom: "&6Attack and defense"
    icone: IRON_SWORD
    description:
      - "Bio Hazard: attack from the"
      - "bridge with one life, defend"
      - "with your forge and shop."
  clutch:
    nom: "&bBlock clutch"
    icone: LADDER
    description:
      - "A hit throws you off: place"
      - "your wool to save yourself."
      - "On an island, or a top fight."

# The NPCs of the lobby. Each one stands on a point placed with /lobby point <name> (the key) and
# opens its modes: a click joins the queue if it has only one, else opens a menu of its modes.
# An NPC whose point is not placed yet does not show.
#   skin   the skin it wears: skins/<skin>.png in the folder of the plugin (64x64, yours), else
#          the one of that name in the jar (attaque, clutch, ranked, prive, ffa, skyrise, rush,
#          invis, bridge, arena, blocs, duels, practice, shop, stats, quetes). Without it: Steve.
#          A 1.8 client shows a skin on an NPC only once Mojang signed it: at the start the server
#          sends each new PNG once to MineSkin (api.mineskin.org) and keeps the answer in skins.yml.
pnj:
  # The ways to play: each NPC opens its whole category (the menu of the compass), with the slogan
  # of the category under its name (sous-titre: another line). Their points: /lobby point
  # practice, rbw, duels, arenas.
  practice:
    nom: "&b&lPractice"
    categorie: entrainement
    skin: practice
  rbw:
    nom: "&6&lRBW Modes"
    categorie: ranked
    skin: ranked
  duels:
    nom: "&a&lDuels"
    categorie: duels
    skin: duels
  arenas:
    nom: "&c&lArenas"
    categorie: arenes
    skin: arena
  # The private games (a Ranked Bedwars or a Top Bridge with friends, the host's settings): /lobby
  # point prive. They stay in the RBW Modes too.
  prive:
    nom: "&6&lPrivate game"
    sous-titre: "&7Your game, your friends, your rules"
    skin: prive
    modes: [partie-privee, top-bridge-prive]
  # Only the NPCs of the ways to play, so that a new player is not lost: every mode stays in its
  # category, in the compass and in the menus of the four. Remove the # before the lines of one to
  # show it again, on its point (/lobby point <name>; for the ones without a point now, place a
