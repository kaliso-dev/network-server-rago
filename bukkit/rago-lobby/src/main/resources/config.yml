# A MineSkin API key (free, https://account.mineskin.org/keys), only if MineSkin refuses to sign
# the skins of the NPCs without one (the log says so). "" asks without a key.
cle-mineskin: ""

# The Network level, from 1 to 1000: every game gives XP to everyone who played it (more for a
# win), every kill a little more, and the quests (quetes:) much more. Everyone starts at level 1;
# going from level n to level n + 1 takes xp-niveau-2 + xp-en-plus-par-niveau x (n - 1) XP up to
# the level 100 (100, 150, 200... by default: about 250,000 XP for the level 100), then as much
# for each level after it (5,050 XP by default). The level shows as [12*] (a star) before the name
# in the chat, after it above the head and in the tab list, in the XP bar of the lobby, the
# scoreboard and the brewing stand of the hotbar (/level). It unlocks the cosmetics of the shop.
#   couleurs     the colour of the [12*] from each level on, up to 100, by tier: a colour code
#                (&6, or &6&l in bold), two for the brackets and the star then the number ("&e&f"
#                gives a yellow [ and star, a white number), or up to 8 colours for a rainbow, one
#                per character ("&c&6&e&a&b&d")
#   recompenses  what a level up to 100 gives (one every 5 levels by default): points (Rago Points)
#                and objets (cosmetics of the shop by id, colours of name and badges of styles: by
#                key, couleur-or, badge-centurion). A cosmetic already bought gives its price back.
#   prestiges    after the level 100, every 100 levels (200, 300... up to 1000): the new couleur of
#                the [200*] (as in couleurs) and what it gives (points, objets, as in recompenses).
#                The whole server hears of it. Left out: these ones; {} for none.
niveau:
  xp-victoire: 50
  xp-defaite: 15
  xp-kill: 5
  xp-niveau-2: 100
  xp-en-plus-par-niveau: 50
  couleurs:
    1: "&7"
    10: "&f"
    20: "&6"
    30: "&b"
    40: "&2"
    50: "&3"
    60: "&4"
    70: "&d"
    80: "&9"
    90: "&5"
    100: "&c&6&e&a&b&d"
  recompenses:
    5: {points: 500, objets: [plus-jaune]}
    10: {objets: [trail-clouds]}
    15: {points: 1000, objets: [plus-vert]}
    20: {objets: [kill-hearts]}
    25: {objets: [couleur-aqua]}
    30: {points: 2000, objets: [plus-aqua]}
    35: {objets: [win-fireworks]}
    40: {objets: [trail-notes]}
    45: {points: 3000, objets: [plus-rouge]}
    50: {points: 5000, objets: [couleur-or]}
    55: {objets: [kill-lightning]}
    60: {objets: [trail-magic]}
    65: {points: 4000, objets: [plus-or]}
    70: {objets: [win-flames]}
    75: {objets: [kill-firework]}
    80: {points: 5000, objets: [trail-ender]}
    85: {objets: [win-party, plus-bleu]}
    90: {objets: [kill-explosion]}
    95: {objets: [trail-redstone]}
    100: {points: 10000, objets: [couleur-legende, badge-centurion]}
  prestiges:
    200: {couleur: "&e&f", points: 20000}
    300: {couleur: "&c&e", points: 25000}
    400: {couleur: "&b&a", points: 30000}
    500: {couleur: "&d&b", points: 35000}
    600: {couleur: "&4&6", points: 40000}
    700: {couleur: "&9&d", points: 45000}
    800: {couleur: "&a&f", points: 50000}
    900: {couleur: "&5&e", points: 55000}
    1000: {couleur: "&6&e&f&e", points: 100000}

# The quests: daily ones (quotidiennes, again every day) and weekly ones (hebdomadaires, again
# every Monday), worth more. They run by themselves; a quest done gives its XP (boosted by
# PREMIUM) once. /quests, or the brewing stand of the hotbar, shows them.
#   nom       what the player reads
#   type      what counts, in the games: parties (games played), victoires (wins), kills,
#             victoires-classees; in the trainings: reussites (successes: a clutch, a run...),
#             records (a new personal best), defi (a score on the daily challenge), minutes (of
#             training, not idle)
#   objectif  how many; xp: the Network XP it gives; mode: count one mode only (its id), or a
#             list of modes
# par-jour: the daily quests drawn each day from quotidiennes, the same for everyone, one of the
# games and one of the trainings at least (0: all of them). Every weekly quest runs all week. 5
# quests at most run at once in a period (the menu shows them in one row).
# debut: Getting started, the quests of a new player, once each: play a training (entrainement),
# beat one of your records (record), play a duel (a 1v1 to the end), import your Hypixel quick
# buy (quick-buy, only with hypixel.cle-api) and find our Discord (/discord, only with its link).
# points: the Rago Points of each; recompense: what all of them give, a cosmetic of the shop or
# a style (one already owned gives its price in points), "" for nothing. actif: false, none.
quetes:
  par-jour: 3
  debut:
    actif: true
    points: {entrainement: 100, record: 150, duel: 150, quick-buy: 100, discord: 100}
    recompense: trail-emeralds
  quotidiennes:
    jouer: {nom: "Play 5 games", type: parties, objectif: 5, xp: 500}
    gagner: {nom: "Win 3 games", type: victoires, objectif: 3, xp: 750}
    kills: {nom: "Get 15 kills", type: kills, objectif: 15, xp: 500}
    classe: {nom: "Win a ranked game", type: victoires-classees, objectif: 1, xp: 750}
    clutchs: {nom: "Land 25 clutches", type: reussites, objectif: 25, xp: 600, mode: [clutch, clutch-top-fight]}
    record: {nom: "Beat a personal best", type: records, objectif: 1, xp: 750}
    defi: {nom: "Play the daily challenge", type: defi, objectif: 1, xp: 500}
    entrainement: {nom: "Train for 15 minutes", type: minutes, objectif: 15, xp: 600}
  hebdomadaires:
    jouer: {nom: "Play 40 games", type: parties, objectif: 40, xp: 3000}
    gagner: {nom: "Win 25 games", type: victoires, objectif: 25, xp: 5000}
    kills: {nom: "Get 100 kills", type: kills, objectif: 100, xp: 3000}
    classe: {nom: "Win 10 ranked games", type: victoires-classees, objectif: 10, xp: 5000}
    entrainement: {nom: "Train for 2 hours", type: minutes, objectif: 120, xp: 4000}

# The ranks, the highest first: the order of the tab list, and a player shows the highest of
# theirs. The staff give a rank with /rank set <player> <rank>, the web store (or an admin) with
# /rank give <player> premium (or vip). A player has the permissions of all their ranks, and of the ranks
# these inherit (herite).
#   prefixe      before the name ("&c[ADMIN] "): with the colour of the name, 16 characters at most
#                (above the head, a longer one loses its brackets: [PREMIUM+] shows PREMIUM+). {+}
#                is a + each player colours in /style (styles.plus), white by default
#   couleur      the colour of the name
#   chat         the colour of the messages (a player without a rank writes in grey)
#   staff        true for a staff rank: never sold
#   permissions  what the rank gives: rago.admin (ranks, points, and all below), rago.mod (bans,
#                mutechat), rago.staff (staff chat, vanish, freeze, mutes, kicks, warnings),
#                rago.perk.chat (no chat cooldown), rago.perk.fly (/fly in the lobby),
#                rago.perk.join (the lobby hears the arrival), rago.perk.nick (/nick),
#                rago.perk.message (a message of one's own above the head), rago.perk.speed
#                (Speed I, II or III in the lobby, chosen in the settings), rago.perk.gadgets (the
#                gadgets and the rarest cosmetics of PREMIUM), rago.perk.booster (a free XP booster
#                a day, /booster), rago.perk.host (/host: events for the whole server, in
#                RagoPractice), rago.perk.spectate (/spectate any game, not only a friend's: the
#                content creators; the staff has it), rago.cosmetic.<id> (owns that cosmetic of
#                the boutique while having the rank: VIP's three), or a permission of another
#                plugin; "-permission" takes one away
#   herite       the rank whose permissions (and colours, badges, boost) this one also has
#   boost-xp     the Network XP of its players is multiplied by this (1.5: half more)
#   style, badge the colour of name and the badge (of styles:) its players wear until they choose
#                another with /style; they own them as long as they have the rank
#   boutique-en-ligne  true: sold on the web store, the shop shows the link (liens.boutique)
#   prix-en-ligne      its price on the web store, shown in the shop and the store ("4.99€")
#   priorite-file      its place in the queues, 0 to 9: the higher are matched first (PREMIUM+ 2,
#                VIP 1), and after a minute of waiting everyone is first in line. Never in a ranked
#                queue: there, whoever waited longest plays first, whatever their rank
#   prix, niveau the price in Rago Points and the Network level needed in the shop (prix: 0 = not sold)
#   prix-cadeau  what gifting it to another player costs in Rago Points (/gift, the shop, or the
#                menu of a player clicked in the lobby), a rank of the web store too; 0 or none:
#                its prix (a rank of the web store without one cannot be gifted). Only a rank with
#                rago.perk.gift (PREMIUM) gifts; the other player says YES or NO in a book, within a
#                minute, and the giver pays at YES. The lobby hears it in a big message, with
#                fireworks around the one who got it
#   icone        the item in the shop; avantages: its lines
rangs:
  owner:
    prefixe: "&4[OWNER] "
    couleur: "&4"
    staff: true
    permissions: [rago.admin]
    herite: admin
  admin:
    prefixe: "&c[ADMIN] "
    couleur: "&c"
    staff: true
    permissions: [rago.admin]
    herite: mod
  dev:
    prefixe: "&b[DEV] "
    couleur: "&b"
    staff: true
    permissions: [rago.admin]
    herite: mod
  mod:
    prefixe: "&2[MOD] "
    couleur: "&2"
    staff: true
    permissions: [rago.mod]
    herite: helper
  helper:
    prefixe: "&9[HELPER] "
    couleur: "&9"
    staff: true
    permissions: [rago.staff]
    herite: premium
  builder:
    prefixe: "&3[BUILDER] "
    couleur: "&3"
    staff: true
    permissions: [rago.staff, rago.lobby.admin]
    herite: premium
  media:
    prefixe: "&c[&fMEDIA&c] "
    couleur: "&c"
    permissions: [rago.perk.spectate]
    herite: premium
    avantages: ["For content creators", "/spectate any game", "Everything of PREMIUM"]
  premium:
    prefixe: "&d[PREMIUM{+}] "
    couleur: "&d"
