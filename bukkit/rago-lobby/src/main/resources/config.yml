# RagoLobby: the main lobby of Rago Practice. How to use it: the README of the module.
# The keys stay in French (monde, titre, modes...): only the comments and the texts are English.

# The lobby world. If it does not exist, the plugin creates it: an empty world with a small
# platform. To use your map, put the name of its world here (for example the one given to
# /monde import), then /lobby setspawn where you want the spawn.
monde: lobby

# Below this height, a player who falls off the lobby goes back to the spawn.
hauteur-vide: 0

# The lobby scoreboard: its title (32 characters at most) and its last line.
titre: "&e&lRAGO PRACTICE"
adresse: "&erago.gg"

# The queues. A ranked queue matches players by their ELO (see elo: below), from
# elo-par-defaut before a player's first ranked game: the ELO gap accepted starts at
# ecart-elo-initial and grows by ecart-elo-pas every ecart-elo-secondes of waiting, up to
# ecart-elo-max.
file:
  elo-par-defaut: 0
  ecart-elo-initial: 100
  ecart-elo-pas: 50
  ecart-elo-secondes: 10
  ecart-elo-max: 500

# The categories of the selector, one per zone of the lobby, in the order of the menu (7 at most):
# left to right, as in the lobby. The compass first shows the categories, then the modes of the
# one picked (28 at most per category). Without a categories section, the compass shows every
# mode at once (35 at most).
categories:
  duels:
    nom: "&a&lDuels"
    icone: IRON_SWORD
    description:
      - "Sumo, boxing, fireball fight,"
      - "attack and defense, KB displace."
  ranked:
    nom: "&6&lRanked Bedwars"
    icone: BED
    description:
      - "Ranked and the Bedwars modes:"
      - "ranked, private game, FFA,"
      - "Arena Free, top fight, Sky Rise..."
  entrainement:
    nom: "&b&lPractice"
    icone: SANDSTONE
    description:
      - "Alone or against a bot: clutch,"
      - "block in, fast defense, fireball..."

# The NPCs of the lobby. Each one stands on a point placed with /lobby point <name> (the key) and
# opens its modes: a click joins the queue if it has only one, else opens a menu of its modes.
# An NPC whose point is not placed yet does not show.
pnj:
  rankedbedwars1v1ou2v2elo:
    nom: "&6&lRanked Bedwars"
    modes: [ranked-1v1, ranked-2v2, ranked-3v3, ranked-4v4]
  privategame:
    nom: "&6Private game"
    modes: [partie-privee, top-fight-prive]
  rbwffa:
    nom: "&cFFA and Top fight"
    modes: [ffa, top-fight-1v1, top-fight-2v2]
  rbwsolo1v1ou2v2skyrise:
    nom: "&6RBW Sky Rise"
    modes: [skyrise-1v1, skyrise-2v2]
  firstrushnebucgelatosoloduo:
    nom: "&eFirst rush"
    modes: [first-rush, first-rush-duo]
  invispracticearwhayinvasion:
    nom: "&5Invis practice"
    modes: [invis-practice]
  realisticplat:
    nom: "&bBridge fight"
    modes: [bridge-fight, bridge-fight-1v1]
  freearenacombo:
    nom: "&aArena Free"
    modes: [free-ffa]
  blockplacementarena:
    nom: "&bBlock placement"
    modes: [block-fight-1v1, block-fight-2v2, block-fight-arena]
  # One NPC per side zone, on the front sign: it opens the whole category.
  attackdefenseversionrbw:
    nom: "&a&lDuels"
    categorie: duels
  blockinpractice:
    nom: "&b&lPractice"
    categorie: entrainement
  aimtrainer:
    nom: "&eAim trainer"
    modes: [aim-trainer]
  # The stats NPCs (type: stats): everyone sees their own profile above it, and a click opens
  # their stats mode by mode. nom: the first line of the profile.
  statsjoueur1:
    nom: "&6&lYour Rago profile"
    type: stats
  statsjoueur2:
    nom: "&6&lYour Rago profile"
    type: stats

# The Network level: every game gives XP to everyone who played it (more for a win), every kill
# a little more. Everyone starts at level 1; going from level n to level n + 1 takes
# xp-niveau-2 + xp-en-plus-par-niveau x (n - 1) XP (100, 150, 200... by default). The level shows
# as [12*] (a star) before the name in the chat, after it above the head and in the tab list, in the XP
# bar of the lobby and the scoreboard. It unlocks the ranks and the cosmetics of the shop.
#   couleurs  the colour of the [12*] from each level on, by tier (one or two colour codes)
niveau:
  xp-victoire: 50
  xp-defaite: 15
  xp-kill: 5
  xp-niveau-2: 100
  xp-en-plus-par-niveau: 50
  couleurs:
    1: "&7"
    10: "&f"
    20: "&6"
    30: "&b"
    40: "&2"
    50: "&3"
    60: "&4"
    70: "&d"
    80: "&9"
    90: "&5"
    100: "&e"

# The ranks, the highest first: the order of the tab list, and a player shows the highest of
# theirs. The staff give a rank with /rank set <player> <rank>; the ranks with a price are sold in
# the shop (/shop) for Rago Points, once the player reaches their level. A player has the
# permissions of all their ranks, and of the ranks these inherit (herite).
#   prefixe      before the name ("&c[ADMIN] "): with the colour of the name, 16 characters at most
#   couleur      the colour of the name
#   chat         the colour of the messages (a player without a rank writes in grey)
#   staff        true for a staff rank: never sold
#   permissions  what the rank gives: rago.admin (ranks, points, and all below), rago.mod (bans,
#                mutechat), rago.staff (staff chat, vanish, freeze, mutes, kicks, warnings),
#                rago.perk.chat (no chat cooldown), rago.perk.fly (/fly in the lobby),
#                rago.perk.join (the lobby hears the arrival), or a permission of another plugin;
#                "-permission" takes one away
#   herite       the rank whose permissions this one also has
#   prix, niveau the price in Rago Points and the Network level needed (prix: 0 = not sold)
#   icone        the item in the shop; avantages: its lines
rangs:
  owner:
    prefixe: "&4[OWNER] "
    couleur: "&4"
    staff: true
    permissions: [rago.admin]
    herite: admin
  admin:
    prefixe: "&c[ADMIN] "
    couleur: "&c"
    staff: true
    permissions: [rago.admin]
    herite: mod
  dev:
    prefixe: "&b[DEV] "
    couleur: "&b"
    staff: true
    permissions: [rago.admin]
    herite: mod
  mod:
    prefixe: "&2[MOD] "
    couleur: "&2"
    staff: true
    permissions: [rago.mod]
    herite: helper
  helper:
    prefixe: "&9[HELPER] "
    couleur: "&9"
    staff: true
    permissions: [rago.staff]
    herite: elite
  builder:
    prefixe: "&3[BUILDER] "
    couleur: "&3"
    staff: true
    permissions: [rago.staff, rago.lobby.admin]
    herite: vipplus
  media:
    prefixe: "&c[&fMEDIA&c] "
    couleur: "&c"
    herite: elite
    avantages: ["For content creators", "Everything of ELITE"]
  legend:
    prefixe: "&6[LEGEND] "
    couleur: "&6"
    herite: elite
    prix: 100000
    niveau: 100
    icone: GOLD_BLOCK
    avantages: ["The [LEGEND] prefix in gold", "Everything of ELITE"]
  elite:
    prefixe: "&b[ELITE] "
    couleur: "&b"
    permissions: [rago.perk.join]
    herite: vipplus
    prix: 40000
    niveau: 50
    icone: DIAMOND_BLOCK
    avantages: ["A firework when you arrive in the lobby", "Everything of VIP+"]
  vipplus:
    prefixe: "&a[VIP&6+&a] "
    couleur: "&a"
    permissions: [rago.perk.fly]
    herite: vip
    prix: 15000
    niveau: 25
    icone: EMERALD_BLOCK
    avantages: ["/fly in the lobby", "Everything of VIP"]
  vip:
    prefixe: "&a[VIP] "
    couleur: "&a"
    permissions: [rago.perk.chat]
    prix: 5000
    niveau: 10
    icone: EMERALD
    avantages: ["Your arrival announced in style", "White messages in the chat", "No chat cooldown"]

# The ELO of the ranked modes, by division as on the Ranked Bedwars servers: everyone starts at 0,
# a division from its elo up to the next one's. A win gives "victoire" ELO and a loss takes
# "defaite", set by the player's division: much to win and little to lose at the bottom, the
# other way round at the top. The MVP of a game (the most kills) gets bonus-mvp more, won or lost.
# The ELO never goes below 0.
elo:
  bonus-mvp: 5
  divisions:
    Coal: {couleur: "&8", elo: 0, victoire: 35, defaite: 5}
    Iron: {couleur: "&f", elo: 100, victoire: 30, defaite: 10}
    Gold: {couleur: "&6", elo: 200, victoire: 30, defaite: 15}
    Diamond: {couleur: "&b", elo: 300, victoire: 25, defaite: 15}
    Emerald: {couleur: "&2", elo: 400, victoire: 25, defaite: 20}
    Sapphire: {couleur: "&3", elo: 500, victoire: 20, defaite: 20}
    Ruby: {couleur: "&4", elo: 600, victoire: 20, defaite: 25}
    Crystal: {couleur: "&d", elo: 700, victoire: 15, defaite: 25}
    Opal: {couleur: "&9", elo: 800, victoire: 15, defaite: 30}
    Amethyst: {couleur: "&5", elo: 900, victoire: 10, defaite: 30}
    Obsidian: {couleur: "&0", elo: 1000, victoire: 10, defaite: 35}

# The Rago Points, spent in the shop: for a win, a game played (lost), a kill, each new level
# (the level times par-niveau: 100 for level 10), and the daily reward (/daily): quotidien, plus
# quotidien-serie for each day in a row, up to 7 days.
rago-points:
  victoire: 20
  defaite: 5
  kill: 2
  par-niveau: 10
  quotidien: 100
  quotidien-serie: 25

# The cosmetics of the shop: projectile trails, kill effects and victory effects. Each one has a
# price in Rago Points and a Network level needed, which can be changed here by its name:
#   trail-clouds, trail-flames, trail-hearts, trail-emeralds, trail-notes, trail-magic,
#   trail-ender, trail-redstone, kill-blood, kill-hearts, kill-flames, kill-lightning,
#   kill-firework, kill-explosion, win-hearts, win-fireworks, win-flames, win-party
# for example:
#   trail-flames: {prix: 1000, niveau: 1}
boutique: {}

# The chat: players without a rank wait delai-secondes between two messages, and cannot send the
# same message twice in a row (bloquer-repetition). The ranks with rago.perk.chat and the staff
# have neither.
chat:
  delai-secondes: 2
  bloquer-repetition: true

# The header and footer of the tab list (4 lines each at most): {joueurs} the players online,
# {ping} the player's ping.
tab:
  haut:
    - "&bYou are playing on &e&lRAGO.GG"
    - ""
  bas:
    - ""
    - "&a{joueurs} players online &8- &7Ping: &f{ping} ms"
    - "&aRanks, Rago Points & MORE! &c&l/SHOP"

# The message under the server's name in the server list (2 lines).
motd:
  - "&b&lRAGO PRACTICE &7- &f1.8 PvP & Ranked Bedwars"
  - "&eRanks, shop and ranked ELO divisions!"

# The tips told to the lobby, one every "minutes", in turn.
annonces:
  minutes: 5
  messages:
    - "&bEarn Rago Points in every game and spend them in the shop (/shop)."
    - "&bClaim your daily reward with /daily: a few days in a row give more."
    - "&bAdd your friends with /friend add <name>, and play with them in a /party."
    - "&bClimb the ranked divisions, from Coal to Obsidian: /top elo."

# What /discord, /site, /rules and /store show (one line or a list).
liens:
  discord: "&9Our Discord: &fdiscord.gg/rago"
  regles:
    - "&6&lRules"
    - "&71. No cheats, macros or unfair mods."
    - "&72. No insults, spam or advertising."
    - "&73. No teaming in solo modes, no boosting."
    - "&74. Respect the staff: their word is final."

# The leaderboard walls, on their point: boards side by side, facing the spawn, the first on the
# left. Each one shows the top 10, the player's place and when it resets.
#   nom       the title above the wall (optional)
#   tableaux  from 1 to 5 of:
#     victoires  the wins, all modes together
#     parties    the games played
#     series     the best win streak
#     kills      the kills (in a sumo: knocking the other one off)
#     niveau     the Network level
#     elo        the ELO of a ranked mode
# A click on a board changes its period (daily, weekly, lifetime) for the one who clicks; on an elo
# board, it changes the ranked mode (1v1, 2v2, 3v3, 4v4).
# A board can group several leaderboards in brackets, for example [elo, kills, niveau]: a right
# click goes to the next one, a left click changes the period or the ranked mode.
classements:
  leaderboardprincipal:
    nom: "&e&lTop players"
    tableaux: [[elo, kills, niveau]]
  leaderboardstats:
    nom: "&e&lLeaderboards"
    tableaux: [victoires, series, parties]
  # The kills in the middle (on the point), the win streaks on the left, the Network level on the right.
  leaderboardplayer:
    nom: "&e&lPlayer leaderboards"
    tableaux: [series, kills, niveau]

# The Hypixel import: players copy the quick buy of their Bed Wars shop and their hotbar manager
# from Hypixel, in one click (the emerald in the kit editor book) or with /hypixel import <name>,
# for the Bed Wars modes and Fast Shop. It asks the Hypixel API with the server's own key:
#   cle-api  the API key of your application on https://developer.hypixel.net ("" turns the
#            import off). Never share it, and never put it in a public repository: anyone with it
#            can use your limits. Each player can import once a minute.
hypixel:
  cle-api: ""

# The private games whose size follows the party: a party leader who clicks one of these modes
# starts a private game of the party against itself (in no stats), in the one of its modes made
# for the party's size: 2 players play the 1v1, 4 the 2v2, 6 the 3v3, 8 the 4v4. A player without
# a party is asked to make one (/party invite <name>).
parties-privees:
  partie-privee: [ranked-1v1, ranked-2v2, ranked-3v3, ranked-4v4]
  top-fight-prive: [top-fight-1v1, top-fight-2v2]

# The modes, in the order of the selector. The id (the key) holds only lowercase letters without
# accents, digits and dashes. A mode stays "Coming soon" in the selector until a game plugin
# hosts it.
#   nom                the name shown (colour codes with &)
#   icone              the item shown in the selector (a Minecraft 1.8 item name)
#   equipes            the number of teams in a game
#   joueurs-par-equipe the number of players in each team
#   categorie          the category of the mode (one of categories: above)
#   classe             true for a ranked mode (ELO)
#   description        the lines under the name
#   kit                the items the mode gives, which players arrange as they like with the kit
#                      editor (the book of the lobby hotbar). A list: the first item goes in the
#                      first hotbar slot, and so on ("" for an empty slot); slots 0 to 8 are the
#                      hotbar, 9 to 35 the inventory, from the top row. An item is ITEM, ITEM amount
#                      or ITEM:data amount, for example IRON_SWORD, "WOOL 64", "WOOL:14 64" (red).
#                      Or slot: item lines:
#                        kit:
#                          0: IRON_SWORD
#                          8: "ENDER_PEARL 2"
#                      The kits below are examples, to adjust: their modes have no game yet. The
#                      sumo has none (bare hands); give it one, a stick for example, to try the
#                      editor in a duel.
modes:
  ranked-1v1:
    nom: "&6Ranked Bedwars 1v1"
    categorie: ranked
    icone: BED
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    description:
      - "Ranked Bedwars in 1v1,"
      - "on Invasion or Lectus:"
      - "your ELO goes up or down"
      - "after every game."
  ranked-2v2:
    nom: "&6Ranked Bedwars 2v2"
    categorie: ranked
    icone: DIAMOND_SWORD
    equipes: 2
    joueurs-par-equipe: 2
    classe: true
    description:
      - "Ranked Bedwars, two against"
      - "two, on Invasion or Lectus."
  ranked-3v3:
    nom: "&6Ranked Bedwars 3v3"
    categorie: ranked
    icone: DIAMOND_CHESTPLATE
    equipes: 2
    joueurs-par-equipe: 3
    classe: true
    description:
      - "Ranked Bedwars, three against"
      - "three, on Invasion or Lectus."
  ranked-4v4:
    nom: "&6Ranked Bedwars 4v4"
    categorie: ranked
    icone: DIAMOND_BLOCK
    equipes: 2
    joueurs-par-equipe: 4
    classe: true
    description:
      - "Ranked Bedwars, four against"
      - "four, on Invasion or Lectus."
  partie-privee:
    nom: "&6Private game"
    categorie: ranked
    icone: NAME_TAG
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    description:
      - "A real private RBW game with your"
      - "party: 1v1, 2v2, 3v3 or 4v4, the"
      - "size follows the party."
  top-fight-prive:
    nom: "&ePrivate top fight"
    categorie: ranked
    icone: GOLD_SWORD
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    description:
      - "Top fight with your party, on a"
      - "ready-made platform: 1v1 or 2v2,"
      - "the size follows the party."
  ffa:
    nom: "&cFFA Ranked Bedwars"
    categorie: ranked
    icone: STONE_SWORD
    equipes: 1
    joueurs-par-equipe: 1
    classe: false
    kit: [IRON_SWORD, "WOOL 64", "WOOL 64", SHEARS, IRON_PICKAXE, "GOLDEN_APPLE 3", "FIREBALL 4", ENDER_PEARL, "TNT 2"]
    description:
      - "Free for all on Archway or"
      - "Paladin, the Ranked Bedwars kit:"
      - "come and go when you like,"
      - "a kill heals you."
  free-ffa:
    nom: "&aArena Free"
    categorie: ranked
    icone: EMERALD
    equipes: 1
    joueurs-par-equipe: 1
    classe: false
    description:
      - "Archway, free for all: the"
      - "forges, a shop of its own,"
      - "and defenses ready on the"
      - "beds for top fights."
  skyrise-1v1:
    nom: "&6RBW Sky Rise 1v1"
    categorie: ranked
    icone: DIAMOND_CHESTPLATE
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    description:
      - "A solo Bedwars, RBW style,"
      - "on Sky Rise."
  skyrise-2v2:
    nom: "&6RBW Sky Rise 2v2"
    categorie: ranked
    icone: DIAMOND_CHESTPLATE
    equipes: 2
    joueurs-par-equipe: 2
    classe: false
    description:
      - "A duo Bedwars, RBW style,"
      - "on Sky Rise."
  first-rush:
    nom: "&eFirst rush solo"
    categorie: ranked
    icone: IRON_PICKAXE
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    description:
      - "A real Bedwars 1v1, RBW style,"
      - "on two islands side by side:"
      - "the first rush decides it."
      - "Choose the map."
  first-rush-duo:
    nom: "&eFirst rush duo"
    categorie: ranked
    icone: IRON_PICKAXE
    equipes: 2
    joueurs-par-equipe: 2
    classe: false
    description:
      - "A real Bedwars 2v2, RBW style,"
      - "on two islands side by side:"
      - "the first rush decides it."
      - "Choose the map."
  invis-practice:
    nom: "&5Invis practice"
    categorie: ranked
    icone: POTION
    equipes: 1
    joueurs-par-equipe: 1
    classe: false
    # the kit of the attacker (the potions: invisibility 30 s and Jump V 45 s, as in the shop);
    # the attacker wears iron armour, Protection I. The defenders have shears, wooden tools and
    # Haste, an iron sword with Sharpness, 2 stacks of wool and iron armour, Protection IV.
    kit: [STONE_SWORD, "WOOL 64", "WOOL 64", "WOOD 16", GOLD_PICKAXE, IRON_AXE, SHEARS, FIREBALL, "EGG 2", "POTION:8206", "POTION:8203"]
    description:
      - "Invasion, Lectus or Archway,"
      - "3-minute rounds: an attacker"
      - "with an invis potion against"
      - "the defenders of the bed,"
      - "each player in turn."
  bridge-fight:
    nom: "&bBridge fight"
    categorie: ranked
    icone: WOOL
    equipes: 1
    joueurs-par-equipe: 1
    classe: false
    kit: [STONE_SWORD, "GOLDEN_APPLE 2"]
    description:
      - "Free for all, no blocks: four"
      - "wool platforms linked by bridges,"
      - "walk from one to another."
  bridge-fight-1v1:
    nom: "&bBridge fight 1v1"
    categorie: ranked
    icone: WOOL
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    kit: [STONE_SWORD, "GOLDEN_APPLE 2"]
    description:
      - "A real 1v1 on a platform of its"
      - "own, no blocks: a kill or a fall"
      - "is a point. First to 5."
  block-fight-1v1:
    nom: "&bBlock placement 1v1"
    categorie: ranked
    icone: SANDSTONE
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    kit: [WOOD_SWORD, "SANDSTONE 64", "SANDSTONE 64", "SANDSTONE 64"]
    description:
      - "Two platforms over the void,"
      - "blocks that never run out:"
      - "build, clutch, knock them off."
      - "First to 5."
  block-fight-2v2:
    nom: "&bBlock placement 2v2"
    categorie: ranked
    icone: SANDSTONE
    equipes: 2
    joueurs-par-equipe: 2
    classe: false
    kit: [WOOD_SWORD, "SANDSTONE 64", "SANDSTONE 64", "SANDSTONE 64"]
    description:
      - "Block placement, two"
      - "against two. First to 5."
  block-fight-arena:
    nom: "&bBlock placement arena"
    categorie: ranked
    icone: SANDSTONE
    equipes: 1
    joueurs-par-equipe: 1
    classe: false
    description:
      - "Block placement in an arena,"
      - "with everyone."
  scenarios-ranked:
    nom: "&4Ranked scenarios"
    categorie: ranked
    icone: REDSTONE
    equipes: 1
    joueurs-par-equipe: 1
    classe: false
    description:
      - "Defend your bed 1 against 2,"
      - "final clutch on 2 hearts... scored."
  sumo:
    nom: "&aSumo duel"
    categorie: duels
    icone: SLIME_BALL
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    description:
      - "Knock the other player off"
      - "the platform: great for"
      - "working on knockback."
  boxing:
    nom: "&fBoxing"
    categorie: duels
    icone: DIAMOND_SWORD
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    kit: [DIAMOND_SWORD]
    description:
      - "First to 100 hits,"
      - "to work on your combos."
  block-edit-duel:
    nom: "&bBlock edit 1v1"
    categorie: duels
    icone: SHEARS
    equipes: 2
    joueurs-par-equipe: 1
    classe: false
    kit: [WOOD_SWORD, SHEARS, "WOOL 64"]
    description:
      - "A wall of wool between you:"
      - "open, hit, close before they hit"
      - "you back. First to 5."
  fireball:
    nom: "&cFireball fight"
    categorie: duels
    icone: FIREBALL
