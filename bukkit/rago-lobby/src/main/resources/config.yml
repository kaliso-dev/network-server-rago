# The billboards of the lobby: an image of yours on a wall of maps in item frames, as on Hypixel
# (your YouTube channel, the Discord, the store...). Each block of the wall is a map of 128 x 128
# pixels: a board of 8 x 8 blocks shows 1024 x 1024 pixels, one of 16 x 9 blocks 2048 x 1152 (a
# 1920 x 1080 image fills it). The image is brought to the colours a 1.8 client draws on maps,
# with dots of near colours (dithering) for the gradients, and shows whole, centred, black around
# it if its shape is not the board's. The players see a board from 128 blocks away.
#   image     the file in plugins/RagoLobby/panneaux/ (PNG or JPG), read at the start
#   largeur   its width in blocks (1 to 16)
#   hauteur   its height in blocks (1 to 16)
#   lieu      "x y z": the block of the middle of its bottom row (just right of the middle for an
#             even width, as seen from in front), the board facing the spawn; "x y z nord" (sud, est,
#             ouest) to face that way. In the game instead: stand there, look where it is seen from
#             and type /lobby point panneau-<name>; that point wins over lieu.
# 8 billboards at most, by name (lowercase letters, digits and dashes), for example:
#   discord: {image: discord.png, largeur: 8, hauteur: 8, lieu: "0 70 40"}
panneaux: {}

# The leaderboard walls, on their point: boards side by side, facing the spawn, the first on the
# left. Each one shows the top 10, the player's place and when it resets.
#   nom       the title above the wall (optional)
#   tableaux  from 1 to 5 of:
#     victoires  the wins, all modes together
#     parties    the games played
#     series     the best win streak
#     kills      the kills (in a sumo: knocking the other one off)
#     fkdr       the final kills / final deaths of Bed Wars, ever (the final kills alone without a
#                final death)
#     niveau     the Network level
#     elo        the ELO of a ranked mode
# A click on a board changes its period (daily, weekly, lifetime) for the one who clicks; on an elo
# board, it changes the ranked mode (1v1, 2v2, 3v3, 4v4); niveau and fkdr have one board.
# A board can group several leaderboards in brackets, for example [elo, kills, niveau]: a click on
# it goes to the next one, a click on its last line changes the period or the ranked mode.
#   podium    the steps of a podium (optional, up to 5, the first place first): on each one stands
#             the player at that place of the first board, in their skin, with their name and score
#             above. Each player sees the top of what they read on the board (ELO, kills or level,
#             the period, the ranked mode). A step is a /lobby point, or "x y z": where the feet of
#             who stands on it go. A click on a step opens that player's stats.
#   periode   jour, semaine or toujours: the boards of the wall stay on that period (a click only
#             goes to the next leaderboard of a board). Left out, each player chooses it.
#   selecteur the point of a leaderboard selector (pnj:, type: selecteur): the wall has one board,
#             with the stat each player chose at the selector, on its periode (needed), and no
#             tableaux. A click on it goes to the next stat on every wall of the selector.
# A board of the week says, under the player's place, what its top wins on Monday (semaine:).
classements:
  top:
    nom: "&6&lTop players"
    # The Network level first (and on the podium); a click goes to the ELO, the FKDR, the kills,
    # then the games played.
    tableaux: [[niveau, elo, fkdr, kills, parties]]
    # The podium: the top 3 of the board, in their skin. Stand on each step and type /lobby point
    # top1 (the first), top2, then top3.
    podium: [top1, top2, top3]
  leaderboards:
    nom: "&6&lLeaderboards"
    tableaux: [victoires, series, parties]
  # The kills in the middle (on the point), the win streaks on the left, the Network level on the right.
  joueurs:
    nom: "&6&lPlayer leaderboards"
    tableaux: [series, kills, niveau]
  # The wall of the week: its boards stay on this week and show what their top 3 wins on Monday
  # (semaine: below). Place it with /lobby point semaine where it is seen from the spawn.
  semaine:
    nom: "&6&lThis week"
    periode: semaine
    tableaux: [victoires, series, [kills, parties]]
    # The podium in front of it: the top 3 of the wins of the week, in their skin. Stand on each
    # step and type /lobby point semaine1 (the first), semaine2, then semaine3.
    podium: [semaine1, semaine2, semaine3]
  # The three walls of the leaderboard selector (pnj: newleaderboardselector), Daily, Weekly and
  # Lifetime, the same stat on the three: the one each player chose at the selector. For example,
  # on three points of their own (in the place of three walls above, take theirs away first):
  # selecteur-jour:
  #   nom: "&c&lDaily"
  #   selecteur: newleaderboardselector
  #   periode: jour
  # selecteur-semaine:
  #   nom: "&c&lWeekly"
  #   selecteur: newleaderboardselector
  #   periode: semaine
  # selecteur-toujours:
  #   nom: "&c&lLifetime"
  #   selecteur: newleaderboardselector
  #   periode: toujours

# The leaderboards of the week: on Monday at midnight (Paris time), the first of each one win
# Rago Points and the badge of the week, worn until the next results, and the whole server hears
# it (the winners away hear it when they come back).
#   classements  the leaderboards of the week rewarded, every mode together: victoires, series,
#                kills, parties. The biggest clutches of the week of the practice come with them.
#   points       the Rago Points of the first, the second, the third... (10 places at most)
#   badge        the badge of styles.badges they wear for the week ("" for none). A player who
#                chose a badge in /style keeps theirs.
#   actif        false: no rewards.
semaine:
  classements: [victoires, series, kills, parties]
  points: [2000, 1000, 500]
  badge: semaine

# The titles of the modes, earned with wins ("Sumo Gold III"), nothing to pay: each title counts
# the wins of its modes together and climbs the steps one after the other, five levels each (I to
# V). A player wears their best one in the chat (before their rank) and their profile, and above
# their name if they choose it; /titles shows them all, and wears another one or none. A new title
# or level is told after the win.
#   paliers   the steps in order, by name (12 characters at most): couleur (of the title), depart
#             (the wins of level I) and pas (the wins between two levels): Gold from 200 by 50 is
#             Gold I at 200 wins, Gold II at 250... Gold V at 400. A step starts after the level V
#             of the one before.
#   familles  the titles (28 at most), by key: nom (what the players read, 20 characters at most)
#             and modes (the ids of the modes whose wins count). The ranked modes have their ELO
#             divisions instead.
#   actif     false: no titles.
titres:
  paliers:
    Bronze: {couleur: "&6", depart: 10, pas: 10}
    Silver: {couleur: "&7", depart: 75, pas: 25}
    Gold: {couleur: "&e", depart: 200, pas: 50}
    Platinum: {couleur: "&3", depart: 500, pas: 100}
    Diamond: {couleur: "&b", depart: 1000, pas: 200}
    Master: {couleur: "&2", depart: 2000, pas: 500}
    Legend: {couleur: "&5", depart: 5000, pas: 1000}
    Mythic: {couleur: "&d", depart: 10000, pas: 2500}
  familles:
    sky-rise: {nom: "Sky Rise", modes: [skyrise-1v1, skyrise-2v2, skyrise-resources-1v1, skyrise-resources-2v2]}
    first-rush: {nom: "First Rush", modes: [first-rush, first-rush-duo, first-rush-full, first-rush-full-duo]}
    bed-fight: {nom: "Bed Fight", modes: [bed-fight-1v1, bed-fight-2v2, bed-fight-1v2, top-bed-fight-1v1]}
    top-bridge: {nom: "Top Bridge", modes: [top-bridge-1v1, top-bridge-2v2, top-bridge-ffa]}
    # with the 2v2, 3v3 and 4v4 of before 22/11: their wins still count
    clutch-scenario: {nom: "Clutch Scenario", modes: [clutch-scenario-1v1, clutch-scenario-1v2, clutch-scenario-1v3,
      clutch-scenario-1v4, clutch-scenario-2v2, clutch-scenario-3v3, clutch-scenario-4v4]}
    attack-defense: {nom: "Attack Defense", modes: [attack-defense-1v1, attack-defense-2v2]}
    invis: {nom: "Invis", modes: [invis-practice, invis-practice-1v1, invis-practice-1v2, invis-practice-1v3,
      invis-practice-1v4]}
    bed-break: {nom: "Bed Break", modes: [bed-break-simulator, bed-break-simulator-1v1, bed-break-simulator-1v2,
      bed-break-simulator-1v3, bed-break-simulator-1v4]}
    sumo: {nom: "Sumo", modes: [sumo]}
    boxing: {nom: "Boxing", modes: [boxing]}
    kb-displace: {nom: "KB Displace", modes: [kb-displace]}
    block-placement: {nom: "Block Placement", modes: [block-fight-1v1, block-fight-2v2]}
    bridge-fight: {nom: "Bridge Fight", modes: [bridge-fight-1v1, bridge-fight-2v2]}
    block-edit: {nom: "Block Edit", modes: [block-edit-duel]}
    fireball: {nom: "Fireball Fight", modes: [fireball]}
    bow: {nom: "Bow Duel", modes: [bow-duel]}
    fireball-knockback: {nom: "Fireball Fight (Fun)", modes: [fireball-knockback]}
    snowball-spleef: {nom: "Snowball Spleef", modes: [snowball-spleef]}
    parkour-duel: {nom: "Parkour Duel", modes: [parkour-duel]}
    capture-the-flag: {nom: "Capture the Flag", modes: [ctf-bridge-1v1, ctf-bridge-2v2, ctf-castle-2v2, ctf-castle-4v4]}
    fast-bedwars: {nom: "Fast Bedwars", modes: [fast-bedwars-1v1, fast-bedwars-2v2]}
    red-rover: {nom: "Red Rover", modes: [red-rover-sumo, red-rover-block-edit, red-rover-block-placement,
        red-rover-top-bridge]}

# The Hypixel import: players copy the quick buy of their Bed Wars shop and their hotbar manager
# from Hypixel, in one click (the emerald in the kit editor book) or with /hypixel import <name>,
# for the Bed Wars modes and Fast Shop. It asks the Hypixel API with the server's own key:
#   cle-api  the API key of your application on https://developer.hypixel.net ("" turns the
#            import off). Never share it, and never put it in a public repository: anyone with it
#            can use your limits. Each player can import once a minute.
hypixel:
  cle-api: ""

# The private games whose size follows the party: a party leader who clicks one of these modes
# starts a private game of the party against itself (in no stats), in the one of its modes made
# for the party's size: 2 players play the 1v1, 4 the 2v2, 6 the 3v3, 8 the 4v4. A player without
# a party is asked to make one (/party invite <name>). None since 22/11: the Private game (RBW 1v1
# to 4v4) and the Private top bridge are replaced by Bedwars Normal (the owner's answer), below.
#   partie-privee: [ranked-1v1, ranked-2v2, ranked-3v3, ranked-4v4]
parties-privees: {}

# The private games whose players choose their teams: Bedwars Normal (the owner's answers of
# 22/11), as on Hypixel. The party leader clicks it and chooses a map, in a row for each mode of
# cartes (the 4s, then the 2s; the maps of each as its game plugin gives them: in Bed Wars, every
# map of 4 teams for the 4s, of 8 teams for the 2s). Then each player of the party chooses their
# team, among the colours of the map, for compte-a-rebours seconds (/pg team opens the menu
# again), and the game starts by itself, in no stats: the teams of the map's size (4 players in
# the 4s, 2 in the 2s), as many as the party fills, two at least; a team full refuses a player,
# and so does a team that would hold the whole party; who chose none goes in the emptiest. A
# party of 2 to 16 players (the owner's limit). The party changing cancels it.
parties-privees-equipes:
  bedwars-normal:
    cartes: [bedwars-normal-4s, bedwars-normal-2s]
    compte-a-rebours: 20

# RagoBot: a player of the server, with the skin of an account and the name RagoBot, invited
# into a party with /p invite RagoBot (or /p RagoBot): it joins at once, next to the leader, one
# for each party that invites it. It plays the party's games of its modes with it, as a member
# of the party (a party of two plays the 1v1 against it, a party with it waits in the 2v2 queue as
# one team), never ranked, never in a random queue, and never leads the party. A game with it
# counts in the players' stats and XP, never in the ELO; it has no stats of its own. It leaves
# the server once back in the lobby without a party (/p kick RagoBot, the party disbanded).
#   actif   false: /p invite RagoBot finds nobody
#   skin    the account whose skin it wears
#   max     RagoBots online at once at most, 1 to 50 (each is a player of the server)
#   modes   the modes it plays (two teams, or a Red Rover; not ranked). In the Block Placement
#           (1v1, 2v2, Red Rover) it uses the blocks of its kit as a player: knocked off over the
#           void, it clutches (a block under its feet); the other on one block of theirs over the
#           void, out of its hits, it breaks that block (shears on the wool, pickaxe on the end
#           stone) and they fall; it jumps up the steps of the maps
#   skill   its one skill, the same for every RagoBot (no levels), to set in game:
#     cps         clicks a second (1 to 20)
#     precision   the chance that a click with its aim on the other lands (0 to 1)
#     portee      its reach, from its eyes to the other's box (1 to 3)
#     strafe      how much it strafes around the other once close (0 to 1)
#     w-tap       the chance of a w-tap after one of its hits (0 to 1)
#     jump-reset  the chance of a jump reset when it is hit on the ground (0 to 1)
#     reaction    how many ticks behind the other it steers (0 to 9)
#     rotation    the degrees it turns its head a tick at most (5 to 180)
#     soin-a      under this health (20 is full), it eats a golden apple of its kit (0 to 20)
#     blocs-par-seconde  blocks it places a second at most (1 to 20)
#   The values below: the "hard" level of the old combo bot, a turn of 30 degrees a tick, a golden
#   apple under 10 health, 6 blocks a second, and 10 RagoBots at most; all to confirm in game.
ragobot:
  actif: true
  skin: qRago
  max: 10
  # Boxing and Lobby Fight 1v1: step 1 of the owner's order of 22/11 (17h54), no new skill; the
  # Block Placement 1v1, 2v2 and its Red Rover: step 2, with the blocks
  modes: [top-bridge-1v1, top-bridge-2v2, sumo, boxing, lobby-fight-1v1, block-fight-1v1, block-fight-2v2,
    red-rover-block-placement]
  skill:
    cps: 11
    precision: 0.88
    portee: 3.0
    strafe: 0.8
    w-tap: 0.75
    jump-reset: 0.45
    reaction: 3
    rotation: 30
    soin-a: 10
    blocs-par-seconde: 6

# The Owner's test tools (plan 7.1), to test the PvP and the protections of the server:
#   /owner reach <3-6|off>     the Owner's hits land up to that far (a fair player's reach is 3),
#                              as a reach cheat's: the first player along their aim, with no block
#                              between, as the server makes a hit
#   /owner scaffold [on|off]   walking off an edge, a block of the one in hand goes under their feet,
#                              as a scaffold cheat's (where the game lets them place a block)
#   /owner off                 both off; /owner alone: what is on
# For this account only: anyone else reads what Spigot answers for a command it does not know (the
# account needs rago.admin too: the owner rank, or op). Off until the Owner turns them on, off
# again once they leave the server. Never in a ranked game: they do nothing there. A game where
# the Owner has a tool on counts for nobody in it: no stats, no XP, no ELO, no record.
#   compte  the Owner's account ("": no tool for anyone)
#   uuid    "" on a server that verifies the names (online mode, or behind BungeeCord); in offline
#           mode, the id of the account on this server, without which the tools stay off (anyone
#           can take a name there)
outils-owner:
  compte: qRago
  uuid: ""

# The modes, in the order of the selector. The id (the key) holds only lowercase letters without
# accents, digits and dashes. A mode stays "Coming soon" in the selector until a game plugin
# hosts it.
#   nom                the name shown (colour codes with &)
#   icone              the item shown in the selector (a Minecraft 1.8 item name). One game keeps
#                      one item in all its modes (FFA, duel, practice, ranked, Red Rover), in the
#                      menus and the NPCs, so that players find it again (the owner's ask of 22/11)
#   equipes            the number of teams in a game
#   joueurs-par-equipe the number of players in each team
#   categorie          the category of the mode (one of categories: above)
#   groupe             the group of the mode in its category (one of groupes: above), if any
#   cache              true: not in the selector, played only through a private game or an
#                      event, or holding the kit that other modes play (kit-de:)
#   classe             true for a ranked mode (ELO)
#   description        the lines under the name
#   kit                the items the mode gives, which players arrange as they like with the kit
#                      editor (the book of the lobby hotbar). A list: the first item goes in the
#                      first hotbar slot, and so on ("" for an empty slot); slots 0 to 8 are the
#                      hotbar, 9 to 35 the inventory, from the top row. An item is ITEM, ITEM amount
#                      or ITEM:data amount, for example IRON_SWORD, "WOOL 64", "WOOL:14 64" (red).
#                      Or slot: item lines:
#                        kit:
#                          0: IRON_SWORD
#                          8: "ENDER_PEARL 2"
#                      The kits below are examples, to adjust: their modes have no game yet. The
#                      sumo has none (bare hands); give it one, a stick for example, to try the
#                      editor in a duel.
#   kit-de             instead of kit: the mode whose kit this one plays, as each player arranged
#                      it: the sizes of one game share one kit, arranged once in the kit editor
#   format             how the menus and the queue show its size ("1v3"), instead of the one its
#                      teams make (2v2; one team of 4 players: "4 joueurs")
modes:
  ranked-1v1:
    nom: "&6Ranked Bedwars 1v1"
    categorie: classe
    groupe: ranked
    icone: BED
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    description:
      - "Ranked Bedwars in 1v1,"
      - "on the 20 maps of the RBW"
      - "queue: your ELO goes up or"
      - "down after every game."
  ranked-2v2:
    nom: "&6Ranked Bedwars 2v2"
    categorie: classe
    groupe: ranked
    icone: BED
    equipes: 2
    joueurs-par-equipe: 2
    classe: true
    description:
      - "Ranked Bedwars, two against"
      - "two, on the RBW maps."
  ranked-3v3:
    nom: "&6Ranked Bedwars 3v3"
    categorie: classe
    groupe: ranked
    icone: BED
    equipes: 2
    joueurs-par-equipe: 3
    classe: true
    description:
      - "Ranked Bedwars, three against"
      - "three, on the RBW maps."
  ranked-4v4:
    nom: "&6Ranked Bedwars 4v4"
    categorie: classe
    groupe: ranked
    icone: BED
    equipes: 2
    joueurs-par-equipe: 4
    classe: true
    description:
      - "Ranked Bedwars, four against"
      - "four, on the RBW maps."
  # The six great duels in ranked 1v1 (plan 3.7, the owner's choice of 22/11): the game of their
  # unranked mode (kit-de: its kit, as each player arranged it), with their own queue by ELO.
  ranked-bed-fight-1v1:
    nom: "&6Ranked Bed Fight 1v1"
    categorie: classe
    icone: BED
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    kit-de: bed-fight-1v1
    description:
      - "Bed fight in 1v1, ranked: your"
      - "ELO goes up or down after"
      - "every game."
  ranked-top-bridge-1v1:
    nom: "&6Ranked Top Bridge 1v1"
    categorie: classe
    icone: LADDER
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    kit-de: top-bridge-1v1
    description:
      - "Top Bridge in 1v1, ranked: the"
      - "first to 5 points wins, your"
      - "ELO follows."
  ranked-bridge-fight-1v1:
    nom: "&6Ranked Bridge Fight 1v1"
    categorie: classe
    icone: WOOL
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    kit-de: bridge-fight-1v1
    description:
      - "Bridge fight in 1v1, ranked:"
      - "first to 5, your ELO follows."
  ranked-block-fight-1v1:
    nom: "&6Ranked Block Placement 1v1"
    categorie: classe
    icone: SANDSTONE
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    kit-de: block-fight-1v1
    description:
      - "Block placement in 1v1, ranked:"
      - "first to 100, your ELO follows."
  ranked-sumo:
    nom: "&6Ranked Sumo"
    categorie: classe
    icone: SLIME_BALL
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    description:
      - "The sumo duel, ranked: knock"
      - "them off, your ELO follows."
  ranked-boxing:
    nom: "&6Ranked Boxing"
    categorie: classe
    icone: DIAMOND_SWORD
    equipes: 2
    joueurs-par-equipe: 1
    classe: true
    kit-de: boxing
    description:
