name: RagoLobby
version: ${version}
main: gg.rago.lobby.RagoLobby
author: Rago
description: The main lobby of Rago Practice (spawn, protection, mode selector, queues).
# PacketEvents (plugin à part, maintenu) envoie les PNJ en forme de joueur et les textes propres à
# chaque joueur. RagoBuildTools charge les mondes de build (avec leur générateur vide) : il passe
# avant, pour que le lobby trouve sa map déjà chargée.
depend: [packetevents]
softdepend: [RagoBuildTools]
commands:
  spawn:
    description: Back to the lobby spawn.
    usage: /spawn
    aliases: [hub]
  queue:
    description: Join the queue of a mode, or leave it.
    usage: /queue <mode|leave>
    aliases: [file, q]
  duel:
    description: Challenge a lobby player to a 1v1.
    usage: /duel <player> [mode], /duel accept <player>, /duel deny <player>
  lobby:
    description: Manage the lobby (staff).
    usage: /lobby <setspawn|build|modes|points|point <name>|point remove <name>|point tp <name>>
permissions:
  rago.lobby.admin:
    description: Place the lobby spawn and points, and edit the lobby in build mode.
    default: op
