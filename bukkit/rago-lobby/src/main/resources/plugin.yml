name: RagoLobby
version: ${version}
main: gg.rago.lobby.RagoLobby
author: Rago
description: The main lobby of Rago Practice (spawn, protection, mode selector, queues).
# PacketEvents (a separate, maintained plugin) sends the player-shaped NPCs and the texts of each
# player. RagoBuildTools loads the build worlds (with their empty generator): it goes first, so
# that the lobby finds its map already loaded.
depend: [packetevents]
softdepend: [RagoBuildTools]
commands:
  spawn:
    description: Back to the lobby spawn.
    usage: /spawn
    aliases: [hub, l]
  queue:
    description: Join the queue of a mode, or leave it.
    usage: /queue <mode> [map] | /queue leave
    aliases: [file, q]
  duel:
    description: Challenge a lobby player to a 1v1.
    usage: /duel <player> [mode], /duel accept <player>, /duel deny <player>
  party:
    description: Parties as on Hypixel. Only the leader joins a queue, for the whole party.
    usage: /party <invite|accept|leave|list|kick|transfer|warp|disband|chat> [player], or /p <player>
    aliases: [p]
  pc:
    description: Send a message to your party.
    usage: /pc <message>
  chat:
    description: Send your chat to your party, or to everyone.
    usage: /chat <party|all>
  hypixel:
    description: Copy your Bed Wars shop and hotbar manager from Hypixel, or see it.
    usage: /hypixel import [name], /hypixel shop
  lobby:
    description: Back to the lobby spawn. The staff also manage the lobby with it.
    usage: /lobby, or (staff) /lobby <setspawn|build|modes|points|point <name>|point remove <name>|point tp <name>>
permissions:
  rago.lobby.admin:
    description: Place the lobby spawn and points, and edit the lobby in build mode.
    default: op
