name: RagoBedwars
version: ${version}
main: gg.rago.bedwars.RagoBedwars
author: Rago
description: The Bed Wars modes of Rago Practice, played from the lobby (Ranked Bedwars to begin with).
depend: [RagoLobby]
softdepend: [RagoBuildTools]
commands:
  bw:
    description: Sets up the Bed Wars maps (spawns, beds, generators, shops).
    aliases: [bedwars]
    usage: /bw help
  ffaspawn:
    description: In the FFA, chooses where you spawn (Archway FFA - Top bridge, Low, Mid or Random).
    aliases: [spawnffa]
    usage: /ffaspawn
  kit:
    description: In Attack and Defense, chooses your kit for the round (3 to attack, 3 to defend).
    aliases: [kits]
    usage: /kit
permissions:
  rago.bedwars.admin:
    description: Sets up the Bed Wars maps with /bw.
    default: op
