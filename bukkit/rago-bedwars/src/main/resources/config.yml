# RagoBedwars: the Bed Wars modes of the lobby, with the rules of a classic Hypixel game.
# Each game is played in a copy of its map (bw_<map>_<n>), made ready again after the game; the
# maps themselves are set up with /bw (see the README of the plugin).

# The lobby modes this plugin plays (their ids in the lobby's config.yml), each with its maps: the
# names of their world folders, or toutes for every map. A map needs at least as many complete
# teams as the mode has teams (two for a mode of one team, which rushes the nearest island). A map
# that is not on the server is skipped; a mode none of whose maps is ready plays on the demo map.
# With two maps or more, the players choose theirs when they join the queue, or take any map (the
# ranked modes always draw the map at random).
modes:
  ranked-1v1: [Archway, Invasion, Lectus, Extinction, Paladin, Rise]
  ranked-2v2: [Archway, Invasion, Lectus, Extinction, Paladin, Rise]
  ranked-3v3: [Archway, Invasion, Lectus, Extinction, Paladin, Rise]
  ranked-4v4: [Archway, Invasion, Lectus, Extinction, Paladin, Rise]
  skyrise-1v1: [SkyRise]
  skyrise-2v2: [SkyRise]
  first-rush: [Acropolis, Ambush, Aqil, Cascade, Crogorm, Frosted, Gelato, Lighthouse, Lotus, Nebuc]
  first-rush-duo: [Acropolis, Ambush, Aqil, Cascade, Crogorm, Frosted, Gelato, Lighthouse, Lotus, Nebuc]

# How many game worlds the server keeps at most, so how many games at once (from 1 to 50).
parties-max: 8

# true: the plugin creates its own demo map, bw-demo, the first time (two islands, a middle with an
# emerald generator, two diamond islands), so that a game can be played before any real map.
carte-demo: true

# Seconds before a dead player comes back, while their team's bed stands (from 0 to 30).
reapparition-secondes: 5

# The generators: one item every so many seconds, at most so many lying on it. The diamond and
# emerald generators have three tiers (I, II, III), faster and faster.
generateurs:
  fer:
    secondes: 1.0
    max: 48
  or:
    secondes: 6.0
    max: 16
  diamant:
    secondes: [30, 23, 12]
    max: 4
  emeraude:
    secondes: [65, 50, 35]
    max: 2

# When things happen, in minutes of game, each after the one above it: the diamond and emerald
# generators go up a tier, the beds left are destroyed (nobody respawns any more), and the game
# ends in a draw.
evenements:
  diamant-2: 6
  emeraude-2: 12
  diamant-3: 18
  emeraude-3: 24
  fin-des-lits: 30
  fin-de-partie: 45

# A fireball's blast does a fixed damage, in half hearts before the armour, so that a fireball jump
# only costs a heart: on the player who threw it, and on the other players it hits (from 0 to 20).
boule-de-feu:
  degats-sur-soi: 2.0
  degats-sur-les-autres: 3.0

# The modes of one team (First Rush): the players rush the bed of the nearest island, against the
# clock, from their own island with its generator and shops. Nobody plays on that island, but its
# bed has a defense: the layers of blocks around it, from the bed outwards (WOOL, STAINED_CLAY and
# STAINED_GLASS take the colour of that island; END_STONE, WOOD, OBSIDIAN... as they are; [] for
# none), 4 at most. The bed broken ends the rush; so does the time limit, in minutes.
premier-rush:
  defense: [WOOL]
  minutes: 5
