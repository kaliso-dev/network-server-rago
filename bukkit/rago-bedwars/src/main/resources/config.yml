# RagoBedwars: the Bed Wars modes of the lobby, with the rules of a classic Hypixel game.
# Each game is played in a copy of its map (bw_<map>_<n>), made ready again after the game; the
# maps themselves are set up with /bw (see the README of the plugin).

# The lobby modes this plugin plays (their ids in the lobby's config.yml), each with its maps: the
# names of their world folders, or toutes for every map. A map needs at least as many complete
# teams as the mode has teams. A map that is not on the server is skipped; a mode none of whose maps is ready plays on the demo map.
# With two maps or more, the players choose theirs when they join the queue (the ranked modes too),
# or take any map: drawn at random for each game, another map than the last one. The ranked modes play on the 20 maps of the RBW
# queue, each with the build limit of the queue (hauteur-max in its bedwars.yml).
modes:
  ranked-1v1: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  ranked-2v2: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  ranked-3v3: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  ranked-4v4: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  top-bridge-1v1: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  top-bridge-2v2: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  skyrise-1v1: [SkyRise]
  skyrise-2v2: [SkyRise]
  first-rush: [Acropolis, Ambush, Aqil, Cascade, Crogorm, Frosted, Gelato, Lighthouse, Lotus, Nebuc]
  first-rush-duo: [Acropolis, Ambush, Aqil, Cascade, Crogorm, Frosted, Gelato, Lighthouse, Lotus, Nebuc]
