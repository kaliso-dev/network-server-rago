# RagoBedwars: the Bed Wars modes of the lobby, with the rules of a classic Hypixel game.
# Each game is played in a copy of its map (bw_<map>_<n>), made ready again after the game; the
# maps themselves are set up with /bw (see the README of the plugin).

# The lobby modes this plugin plays (their ids in the lobby's config.yml), each with its maps: the
# names of their world folders, or toutes for every map. A map needs at least as many complete
# teams as the mode has teams. A map that is not on the server is skipped; a mode none of whose maps is ready plays on the demo map.
# With two maps or more, the players choose theirs when they join the queue (the ranked modes too),
# or take any map: drawn at random for each game, another map than the last one. The ranked modes play on the 20 maps of the RBW
# queue, each with the build limit of the queue (hauteur-max in its bedwars.yml).
modes:
  ranked-1v1: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  ranked-2v2: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  ranked-3v3: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  ranked-4v4: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  top-bridge-1v1: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  top-bridge-2v2: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  skyrise-1v1: [SkyRise]
  skyrise-2v2: [SkyRise]
  first-rush: [Acropolis, Ambush, Aqil, Cascade, Crogorm, Frosted, Gelato, Lighthouse, Lotus, Nebuc]
  first-rush-duo: [Acropolis, Ambush, Aqil, Cascade, Crogorm, Frosted, Gelato, Lighthouse, Lotus, Nebuc]
  top-bridge-ffa: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  ffa: [Archway, Paladin]
  invis-practice: [Antenna, Aquarium, Archway, Artemis, Boletum, Carapace, Catalyst, Chained, Eastwood, Extinction, Invasion, Katsu, Lectus, Obelisk, Paladin, Planet98, Rise, Stonekeep, Swashbuckle, Treenan]
  shop-practice: [Archway]

# The modes that are not a classic Bed Wars game, each with its kind of game:
#   ffa        free for all, open: players join and leave when they like, each for themselves, and
#              come back 3 seconds after a death on the island farthest from the others; the
#              mode's kit (the lobby's kit editor) and iron armour at each life, a kill heals the
#              killer; the blocks placed go after 45 seconds
#   arene      the same with the forges, the diamonds and emeralds and a shop of its own (the
#              diamonds buy Sharpness, Power II, Strength...), the armour and tools kept as in Bed
#              Wars, and on each bed a defense of three layers ready for top fights (no mode plays
#              it now: Arena Free, free-ffa, is on the owner's Arena, in the practice plugin)
#   invis      invis practice: 2 to 6 players on the map chosen, rounds of 3 minutes, one invisible
#              (the mode's kit), at mid in front of the base to attack, against the others (a
#              ranked defense on their bed: end stone, glass, wood, wool); a hit makes the
#              invisible visible; each player in turn; it starts 20 seconds after the second joins
#   top-bridge Top Bridge: no bed, no forge, the fight on the top bridge alone (see top-bridge:
#              below), everyone starting on top with the mode's kit and iron armour, dead when
#              they fall off it; rounds of one life, the first team to 5 points wins; in a
#              party's private game, a practice: back on top 2 seconds after a death, 30 minutes
#   fast-shop  Fast Shop: each player on an island with its shop, lists of items to buy as fast as
#              possible with their own quick buy (copied from Hypixel in the lobby), and records
# A mode not listed is a classic game.
jeux:
  top-bridge-1v1: top-bridge
  top-bridge-2v2: top-bridge
  top-bridge-ffa: ffa
  ffa: ffa
  invis-practice: invis
  shop-practice: fast-shop

# How many game worlds the server keeps at most, so how many games at once (from 1 to 50).
parties-max: 8

# true: the plugin creates its own demo map, bw-demo, the first time (two islands, a middle with an
# emerald generator, two diamond islands), so that a game can be played before any real map.
carte-demo: true

# Seconds before a dead player comes back, while their team's bed stands (from 0 to 30).
reapparition-secondes: 5

# The modes whose games have a top bridge, the one the owner built on Antenna, on every map: when
# the game starts, a platform of wool 17 blocks wide high over the middle, in the colours of the two
# teams, and from the front of each island a stairway of wool up to it (one block up every two).
# It is 16 blocks above the beds, as on Antenna, or a little higher or lower where the map is in
# the way or the islands are near. Players build up to 10 blocks above it, and cannot break it; it
# goes with the game. In a free for all (top-bridge-ffa), it links the two islands farthest apart,
# and everyone starts and comes back on the platform, with a sword only; a player 10 blocks under
# it has fallen, dead as in the void (in the top-bridge games too).
top-bridge: [top-bridge-1v1, top-bridge-2v2, top-bridge-ffa]

# The modes whose teams play on neighbouring islands (First Rush: the first island and the one
# next to it), instead of opposite islands as in the other modes.
iles-voisines: [first-rush, first-rush-duo]

# The forge of each island, as on Hypixel (its iron and gold counted a minute long on each map): an
# iron node drops an ingot every fer-secondes-par-noeud seconds (30 a minute), and a forge has 1
# node on the slow maps (lente), 2 on the medium ones (moyenne), 3 on the fast ones (rapide), and
# one more on the maps of four teams or fewer: 90 iron a minute on a fast map of 8 teams, 120 on
# the 20 maps of the RBW queue. The iron drops in batches of fer-par-lot ingots (2 or 4 at once,
# drawn at random). Gold: an ingot every or-secondes (8 a minute), every or-secondes-4-equipes on
# the maps of four teams or fewer (12 a minute). At most max-fer iron and max-or gold lie on it.
# During the first debut-rapide-secondes of a game, it goes twice as fast.
#   vitesses   each map's speed, by the name of its world folder: one speed, or one for solo and
#              one for teams of two or more ({solo: lente, equipes: moyenne}, as Lighthouse and
#              Lotus on Hypixel). A map not listed: vitesse-par-defaut (rapide, as every Hypixel map
#              since 2019).
forge:
  fer-secondes-par-noeud: 2
  fer-par-lot: [2, 4]
  or-secondes: 7.5
  or-secondes-4-equipes: 5
  max-fer: 48
  max-or: 16
  debut-rapide-secondes: 30
  vitesse-par-defaut: rapide
  vitesses:
    Acropolis: rapide
    Cascade: rapide
    Crogorm: rapide
    SkyRise: rapide
    Lighthouse: {solo: lente, equipes: moyenne}
    Lotus: {solo: lente, equipes: moyenne}

# The diamond and emerald generators: one item every so many seconds, at most so many lying on
# it; three tiers (I, II, III), faster and faster.
generateurs:
  diamant:
    secondes: [30, 23, 12]
    max: 4
  emeraude:
    secondes: [65, 50, 35]
    max: 2

# When things happen, in minutes of game, each after the one above it: the diamond and emerald
# generators go up a tier, the beds left are destroyed (nobody respawns any more), and the game
# ends in a draw.
evenements:
  diamant-2: 6
  emeraude-2: 12
  diamant-3: 18
  emeraude-3: 24
  fin-des-lits: 30
  fin-de-partie: 45

# The fireball, as on Hypixel (the values of BedWars1058, the open copy of Hypixel's Bed Wars):
#   vitesse            its speed when thrown, in blocks a tick; it then speeds up a little
#   rayon              its blast pushes the players up to this many blocks away, on each axis
#   recul-horizontal   the push away from the blast, horizontally (more when the blast is level
#                      with the player, as when it lands just in front of their feet)
#   recul-vertical     the push upwards (x 1.5): a fireball jump
#   degats-...         its fixed damage, armour or not, in half hearts (0 to 20): on the player who
#                      threw it, on the other teams, on their own team
# The blast itself only breaks placed blocks, never the blast-proof glass or the obsidian.
boule-de-feu:
  vitesse: 1.0
  rayon: 3
  recul-horizontal: 1.0
  recul-vertical: 0.65
  degats-sur-soi: 2.0
  degats-sur-les-autres: 2.0
  degats-sur-les-coequipiers: 0.0
