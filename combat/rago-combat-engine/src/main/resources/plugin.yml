name: RagoCombatEngine
version: ${version}
main: gg.rago.combat.engine.RagoCombatEngine
author: Rago
description: Moteur de combat Rago, knockback paramétrable et mesurable pour les serveurs 1.8.8.
commands:
  kb:
    description: Réglages du moteur de combat (staff).
    usage: /kb <status|profiles|profile|world|mode|debug|sparring|reload>
    permission: rago.combat.admin
    permission-message: Commande réservée au staff.
permissions:
  rago.combat.admin:
    description: Voir et changer les réglages du moteur de combat.
    default: op
