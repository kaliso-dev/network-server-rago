name: RagoCombatEngine
version: ${version}
main: gg.rago.combat.engine.RagoCombatEngine
author: Rago
description: The Rago combat engine, configurable and measurable knockback for 1.8.8 servers.
commands:
  kb:
    description: Combat engine settings (staff).
    usage: /kb <status|profiles|profile|world|mode|debug|sparring|reload>
    permission: rago.combat.admin
    permission-message: This command is for the staff.
permissions:
  rago.combat.admin:
    description: See and change the combat engine settings.
    default: op
