# RagoCombatEngine
#
# override : le moteur remplace le knockback du serveur par celui du profil.
# observe  : le moteur calcule et journalise, mais le serveur garde son propre knockback.
mode: override

# Profil appliqué partout, sauf dans les mondes listés sous world-profiles.
# Profils intégrés, qui ne se redéfinissent pas :
#   vanilla           : le knockback exact de Minecraft 1.8.8.
#   hypixel-approx-v1 : mesuré sur Hypixel le 7 novembre 2026 (docs/combat/mesures-hypixel.md) :
#                       vanilla, sauf la poussée verticale d'un coup en sprint, 0.07 au lieu de 0.1.
active-profile: vanilla

# Profil par monde, pour comparer deux profils sur deux arènes. Exemple :
# world-profiles:
#   arena_a: vanilla
#   arena_b: test-a
world-profiles: {}

# Délai entre deux coups, en ticks : un coup ne compte en entier (dégâts, knockback) qu'à partir de
# ce nombre de ticks après le coup précédent. Vanilla : 10 (500 ms). Mesuré sur Hypixel : 9.
# Il vaut pour tous les dégâts (chute, feu, flèches), pas seulement le corps à corps. De 1 à 20.
hit-delay-ticks: 10

# Ping simulé en combat, en millisecondes (0 = désactivé, 500 au plus). Expérimental : voir
# docs/combat/mesures-hypixel.md. Pour les coups au corps à corps seulement, le moteur fait comme si
# chaque victime qui a moins de ce ping l'avait. Les blocs et les déplacements ne changent pas.
# Le kb part en retard vers la victime, du ping qui lui manque : avec 150, 150 ms pour une victime à
# 0 ms, 102 ms pour une à 48 ms. Pendant ce temps, la victime peut encore rendre le coup, et le
# serveur garde son mouvement d'avant le coup : le coup suivant d'un combo l'envoie plus haut, comme
# avec du vrai ping. D'après la mesure du Bedwars, un joueur à 150 ms sur Hypixel y a les combos
# d'environ 120 ici : c'est la valeur à essayer d'abord.
ping-simulation-ms: 0

# false : le kb part sans retard, et tout le ping qui manque à la victime passe par le mouvement plus
# ancien (la première version du réglage).
ping-simulation-delays-knockback: true

# Écrit chaque hit dans plugins/RagoCombatEngine/hits/hits-AAAA-MM-JJ.jsonl pour l'analyse.
record-hits: false

# Profils de test. Les six clés sont obligatoires et aucune autre n'est acceptée.
# Les valeurs d'Hypixel ne sont pas publiques : un profil censé s'en approcher doit venir
# des mesures (docs/combat/knockback-1.8.8.md), jamais d'une supposition.
#
# friction         : la vitesse côté serveur de la victime est divisée par ce nombre (vanilla 2.0)
# horizontal       : poussée horizontale à l'opposé de l'attaquant (vanilla 0.4000000059604645)
# vertical         : poussée verticale (vanilla 0.4000000059604645)
# vertical-limit   : plafond de la vitesse verticale après la poussée (vanilla 0.4000000059604645)
# extra-horizontal : poussée en plus par niveau (sprint = 1 niveau, enchant Knockback = 1 par niveau),
#                    dans la direction où regarde l'attaquant (vanilla 0.5)
# extra-vertical   : poussée verticale en plus quand le niveau est au moins 1 (vanilla 0.1)
profiles: {}
# Exemple de format (valeurs arbitraires, pas un réglage recommandé) :
# profiles:
#   test-a:
#     friction: 2.0
#     horizontal: 0.35
#     vertical: 0.35
#     vertical-limit: 0.4
#     extra-horizontal: 0.5
#     extra-vertical: 0.1
