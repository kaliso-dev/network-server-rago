# RagoCombatEngine
#
# override: the engine replaces the server's knockback with the profile's.
# observe:  the engine computes and logs, but the server keeps its own knockback.
mode: override

# The profile used everywhere, except in the worlds listed under world-profiles.
# "vanilla" is built in: the exact knockback of Minecraft 1.8.8, it cannot be redefined.
active-profile: vanilla

# A profile per world, to compare two profiles on two arenas. Example:
# world-profiles:
#   arena_a: vanilla
#   arena_b: test-a
world-profiles: {}

# Writes every hit to plugins/RagoCombatEngine/hits/hits-YYYY-MM-DD.jsonl for analysis.
record-hits: false

# Test profiles. The six keys are required and no other is accepted.
# Hypixel's values are not public: a profile meant to come close to them must come from
# measurements (docs/combat/knockback-1.8.8.md), never from a guess.
#
# friction:         the victim's server-side velocity is divided by this number (vanilla 2.0)
# horizontal:       horizontal push away from the attacker (vanilla 0.4000000059604645)
# vertical:         vertical push (vanilla 0.4000000059604645)
# vertical-limit:   cap of the vertical velocity after the push (vanilla 0.4000000059604645)
# extra-horizontal: extra push per level (sprint = 1 level, Knockback enchantment = 1 per level),
#                   in the direction the attacker looks (vanilla 0.5)
# extra-vertical:   extra vertical push when the level is at least 1 (vanilla 0.1)
profiles: {}
# Example of the format (arbitrary values, not a recommended setting):
# profiles:
#   test-a:
#     friction: 2.0
#     horizontal: 0.35
#     vertical: 0.35
#     vertical-limit: 0.4
#     extra-horizontal: 0.5
#     extra-vertical: 0.1
