name: RagoBuildTools
version: ${version}
main: gg.rago.buildtools.RagoBuildTools
author: Rago
description: Build tools of the Rago test server (empty worlds, creative, protection, frequent saving).
commands:
  monde:
    description: List, create, import and visit the build worlds.
    usage: /monde <list|create|import|tp|spawn|save>
    aliases: [world, worlds]
    permission: rago.build.admin
    permission-message: This command is for the builders.
  vitesse:
    description: Flying speed, from 1 (normal) to 10.
    usage: /speed <1-10>
    aliases: [speed]
    permission: rago.build.admin
    permission-message: This command is for the builders.
  nv:
    description: Turns night vision on or off.
    usage: /nv
    permission: rago.build.admin
    permission-message: This command is for the builders.
permissions:
  rago.build.admin:
    description: Manage the build worlds and use /speed and /nv.
    default: op
  rago.build.construire:
    description: Place and break blocks in the protected worlds.
    default: op
