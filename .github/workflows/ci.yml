name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # Compiles every module with --release 8, the plugins against the real Spigot 1.8.8 API.
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: rago-combat-engine
          path: combat/rago-combat-engine/build/libs/*.jar
          if-no-files-found: error

      # The local test server for players (tools/local-server): the launchers, the settings, the
      # guide as LISEZ-MOI.txt and the plugin. The zip of this artifact is what a player downloads.
      - name: Assemble the local test server
        run: |
          kit=build/rago-serveur-de-test
          rm -rf "$kit"
          mkdir -p "$kit/plugins"
          cp tools/local-server/lancer-windows.bat tools/local-server/lancer.ps1 \
            tools/local-server/lancer-mac-linux.sh tools/local-server/server.properties "$kit/"
          cp tools/local-server/README.md "$kit/LISEZ-MOI.txt"
          cp combat/rago-combat-engine/build/libs/*.jar "$kit/plugins/"
          ls -lR "$kit"

      - uses: actions/upload-artifact@v7
        with:
          name: rago-serveur-de-test
          path: build/rago-serveur-de-test/
          if-no-files-found: error

  control-test:
    name: KB control test (PandaSpigot 1.8.8, Java ${{ matrix.server-java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The two Java versions players and servers may use; Gradle itself runs on Java 21.
        server-java: [8, 21]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/kb-control/bots/package-lock.json

      - run: ./gradlew assemble :kb-control:installDist

      - run: npm ci
        working-directory: tools/kb-control/bots

      - name: Run the control test
        env:
          # The test starts a Minecraft server, which requires accepting the Minecraft EULA:
          # https://aka.ms/MinecraftEULA
          KB_ACCEPT_EULA: "true"
          SERVER_JAVA_HOME: JAVA_HOME_${{ matrix.server-java }}_X64
        run: |
          KB_SERVER_JAVA="${!SERVER_JAVA_HOME}/bin/java"
          export KB_SERVER_JAVA
          tools/kb-control/run-control-test.sh

      - name: Report
        if: always()
        run: |
          if [ -f control-run/report.md ]; then
            cat control-run/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the control test stopped before the check. See the job log and the artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f control-run/report-hit-delay.md ]; then
            cat control-run/report-hit-delay.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kb-control-run-java${{ matrix.server-java }}
          path: |
            control-run/report.md
            control-run/report-hit-delay.md
            control-run/received.jsonl
            control-run/bursts.jsonl
            control-run/server.log
            control-run/server/logs/
            control-run/server/plugins/RagoCombatEngine/hits/
          if-no-files-found: warn

  # Starts the local test server the way a player does (tools/local-server), on Linux (the same
  # script as macOS) and Windows, with both Java versions its guide allows.
  local-server:
    name: Local test server (${{ matrix.os }}, Java ${{ matrix.java }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [8, 21]
    env:
      # The launchers ask the player to accept the Minecraft EULA (https://aka.ms/MinecraftEULA);
      # this answers for the test server.
      RAGO_ACCEPTE_CLUF: oui
      RAGO_MEMOIRE: 1G
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/download-artifact@v8
        with:
          name: rago-serveur-de-test
          path: kit

      - name: Start the server (Linux)
        if: runner.os == 'Linux'
        working-directory: kit
        run: |
          # The server console reads a pipe that stays open, so that "stop" can be typed into it.
          mkfifo console
          bash lancer-mac-linux.sh < console > launch.log 2>&1 &
          pid=$!
          exec 3> console
          started=false
          for _ in $(seq 1 240); do
            if grep -qsF 'Done (' logs/latest.log; then started=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$started" = true ]; then
            echo stop >&3
            for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          fi
          cat launch.log
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "::error::the server did not stop when stop was typed in its console"
            exit 1
          fi
          [ "$started" = true ] || { echo "::error::the server did not start"; exit 1; }
          grep -F 'git-PandaSpigot-226' logs/latest.log
          grep -F '[RagoCombatEngine] Mode override, default profile vanilla' logs/latest.log
          grep -F 'Stopping server' logs/latest.log

      - name: Start the server (Windows)
        if: runner.os == 'Windows'
        working-directory: kit
        shell: pwsh
        run: |
          # The player's path: lancer-windows.bat, which runs lancer.ps1 with Windows PowerShell 5.1.
          $launcher = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'lancer-windows.bat' -PassThru `
            -RedirectStandardOutput launch.log -RedirectStandardError launch.err -WorkingDirectory $PWD
          $started = $false
          $launchedAt = Get-Date
          $deadline = $launchedAt.AddMinutes(8)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path logs/latest.log) -and (Select-String -Path logs/latest.log -Pattern 'Done (' -SimpleMatch -Quiet)) {
              $started = $true
              break
            }
            if ($launcher.HasExited) { break }
            # Once lancer.ps1 has ended, the batch file waits on "pause": stop waiting for the server.
            $launcherScript = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($launcher.Id) AND Name = 'powershell.exe'")
            if ($launcherScript.Count -eq 0 -and ((Get-Date) - $launchedAt).TotalSeconds -gt 15) { break }
            Start-Sleep -Seconds 2
          }
          Get-Content launch.log, launch.err -ErrorAction SilentlyContinue
          taskkill /T /F /PID $launcher.Id 2>$null
          if (-not $started) { Write-Output '::error::the server did not start'; exit 1 }
          foreach ($expected in 'git-PandaSpigot-226', '[RagoCombatEngine] Mode override, default profile vanilla') {
            if (-not (Select-String -Path logs/latest.log -Pattern $expected -SimpleMatch -Quiet)) {
              Write-Output "::error::missing in the server log: $expected"
              exit 1
            }
          }
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-server-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            kit/launch.log
            kit/logs/
          if-no-files-found: warn
