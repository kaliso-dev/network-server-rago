name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # Compiles every module with --release 8, the plugins against the real Spigot 1.8.8 API.
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: rago-combat-engine
          path: combat/rago-combat-engine/build/libs/*.jar
          if-no-files-found: error

      # The two launchers download the same files: they must pin the same SHA-256 sums.
      - name: Check that both launchers pin the same downloads
        run: |
          sums=$(grep -oE '[0-9a-f]{64}' tools/local-server/lancer-mac-linux.sh | sort)
          [ "$sums" = "$(grep -oE '[0-9a-f]{64}' tools/local-server/lancer.ps1 | sort)" ] || {
            echo "::error::lancer-mac-linux.sh and lancer.ps1 do not pin the same SHA-256 sums"; exit 1; }
          echo "$sums"

      # PacketEvents comes from its GitHub release: the launchers and the lobby test must pin the
      # SHA-256 that GitHub computed for that file when it was published.
      - name: Check the PacketEvents pin against its GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/retrooper/packetevents/releases/tags/v2.14.0)
          printf '%s' "$release" | jq -r '.assets[] | [.name, .digest, .browser_download_url] | @tsv'
          digest=$(printf '%s' "$release" | jq -r '.assets[] | select(.name == "packetevents-spigot-2.14.0.jar") | .digest')
          echo "packetevents-spigot-2.14.0.jar: $digest"
          [[ "$digest" == sha256:* ]] || { echo "::error::no SHA-256 for packetevents-spigot-2.14.0.jar on its release"; exit 1; }
          for file in tools/local-server/lancer-mac-linux.sh tools/local-server/lancer.ps1 tools/lobby-check/run-lobby-test.sh; do
            grep -qF "${digest#sha256:}" "$file" || {
              echo "::error::$file does not pin the SHA-256 of the PacketEvents release ($digest)"; exit 1; }
          done

      # The local test server for players (tools/local-server): the launchers, the settings, the
      # server icon (the Rago Practice logo), the guide as LISEZ-MOI.txt and the plugins. The zip of
      # this artifact is what a player downloads.
      # WorldEdit is not in it: the launchers download it from its publisher and check its sum.
      - name: Assemble the local test server
        run: |
          kit=build/rago-serveur-de-test
          rm -rf "$kit"
          mkdir -p "$kit/plugins"
          cp tools/local-server/lancer-windows.bat tools/local-server/lancer.ps1 \
            tools/local-server/lancer-mac-linux.sh tools/local-server/server.properties \
            tools/local-server/server-icon.png "$kit/"
          cp tools/local-server/README.md "$kit/LISEZ-MOI.txt"
          cp combat/rago-combat-engine/build/libs/*.jar tools/build-tools/build/libs/*.jar \
            bukkit/rago-lobby/build/libs/*.jar bukkit/rago-practice/build/libs/*.jar \
            bukkit/rago-bedwars/build/libs/*.jar "$kit/plugins/"
          ls -lR "$kit"

      - uses: actions/upload-artifact@v7
        with:
          name: rago-serveur-de-test
          path: build/rago-serveur-de-test/
          if-no-files-found: error

  control-test:
    name: KB control test (PandaSpigot 1.8.8, Java ${{ matrix.server-java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The two Java versions players and servers may use; Gradle itself runs on Java 21.
        server-java: [8, 21]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/kb-control/bots/package-lock.json

      - run: ./gradlew assemble :kb-control:installDist

      - run: npm ci
        working-directory: tools/kb-control/bots

      - name: Run the control test
        env:
          # The test starts a Minecraft server, which requires accepting the Minecraft EULA:
          # https://aka.ms/MinecraftEULA
          KB_ACCEPT_EULA: "true"
          SERVER_JAVA_HOME: JAVA_HOME_${{ matrix.server-java }}_X64
        run: |
          KB_SERVER_JAVA="${!SERVER_JAVA_HOME}/bin/java"
          export KB_SERVER_JAVA
          tools/kb-control/run-control-test.sh

      - name: Report
        if: always()
        run: |
          if [ -f control-run/report.md ]; then
            cat control-run/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the control test stopped before the check. See the job log and the artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kb-control-run-java${{ matrix.server-java }}
          path: |
            control-run/report.md
            control-run/received.jsonl
            control-run/server.log
            control-run/server/logs/
            control-run/server/plugins/RagoCombatEngine/hits/
          if-no-files-found: warn

  lobby-test:
    name: Lobby and sumo test (PandaSpigot 1.8.8, Java ${{ matrix.server-java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server-java: [8, 21]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/kb-control/bots/package-lock.json

      - run: ./gradlew assemble

      - run: npm ci
        working-directory: tools/kb-control/bots

      - name: Run the lobby and sumo test
        env:
          # The test starts a Minecraft server, which requires accepting the Minecraft EULA:
          # https://aka.ms/MinecraftEULA
          KB_ACCEPT_EULA: "true"
          SERVER_JAVA_HOME: JAVA_HOME_${{ matrix.server-java }}_X64
        run: |
          KB_SERVER_JAVA="${!SERVER_JAVA_HOME}/bin/java"
          export KB_SERVER_JAVA
          tools/lobby-check/run-lobby-test.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lobby-test-java${{ matrix.server-java }}
          path: |
            lobby-run/server.log
            lobby-run/server/logs/
          if-no-files-found: warn

  # Starts the local test server the way a player does (tools/local-server), on Linux (the same
  # script as macOS) and Windows, with both Java versions its guide allows.
  local-server:
    name: Local test server (${{ matrix.os }}, Java ${{ matrix.java }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [8, 21]
    env:
      # The launchers ask the player to accept the Minecraft EULA (https://aka.ms/MinecraftEULA);
      # this answers for the test server.
      RAGO_ACCEPTE_CLUF: oui
      RAGO_MEMOIRE: 1G
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/download-artifact@v8
        with:
          name: rago-serveur-de-test
          path: kit

      # The pinned SHA-256 of WorldEdit is checked against the MD5 its publisher shows on
      # https://dev.bukkit.org/projects/worldedit/files/880435, so the pin is the publisher's file.
      - name: Check that WorldEdit is the file dev.bukkit.org publishes
        if: runner.os == 'Linux'
        working-directory: kit
        run: |
          mkdir -p plugins
          curl -fsSL --retry 3 --retry-delay 5 -o plugins/worldedit-bukkit-6.1.jar \
            https://mediafilez.forgecdn.net/files/880/435/worldedit-bukkit-6.1.jar
          md5=$(md5sum plugins/worldedit-bukkit-6.1.jar | cut -d' ' -f1)
          sha256=$(sha256sum plugins/worldedit-bukkit-6.1.jar | cut -d' ' -f1)
          echo "WorldEdit 6.1: MD5 $md5, SHA-256 $sha256"
          [ "$md5" = 13749e1701499d379765bb218191035a ] || {
            echo "::error::WorldEdit 6.1 does not have the MD5 shown by dev.bukkit.org"; exit 1; }
          grep -qF "WORLDEDIT_SHA256=$sha256" lancer-mac-linux.sh || {
            echo "::error::the launchers do not pin the SHA-256 of WorldEdit 6.1 ($sha256)"; exit 1; }

      # Two launches, as a builder does: the first creates a build world, the second must find it
      # again and start with a backup of it.
      - name: Start the server twice (Linux)
        if: runner.os == 'Linux'
        working-directory: kit
        run: |
          data=$HOME/Rago
          mkdir -p "$data/schematics"
          printf 'not a real schematic\n' > "$data/schematics/ci-test.schematic"

          # $1: text expected in the server log, $2: how many tries, two seconds apart.
          wait_for() {
            for _ in $(seq 1 "$2"); do
              if grep -qsF "$1" logs/latest.log; then return 0; fi
              kill -0 "$pid" 2>/dev/null || return 1
              sleep 2
            done
            return 1
          }
          fail() { echo "::error::$1"; [ -f logs/latest.log ] && cat logs/latest.log; exit 1; }
          expect() { grep -F "$1" "$2" || fail "missing in $2: $1"; }
          # The server console reads a pipe that stays open, so that commands can be typed into it.
          start_server() {
            rm -f console
            mkfifo console
            bash lancer-mac-linux.sh < console > "launch-$1.log" 2>&1 &
            pid=$!
            exec 3> console
            wait_for 'Done (' 240 || { cat "launch-$1.log"; fail "the server did not start (launch $1)"; }
          }
          stop_server() {
            echo stop >&3
            for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            cat "launch-$1.log"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
              fail "the server did not stop when stop was typed in its console (launch $1)"
            fi
            exec 3>&-
            expect 'Stopping server' logs/latest.log
            mv logs/latest.log "logs/launch-$1.log"
          }

          start_server 1
          expect 'git-PandaSpigot-226' logs/latest.log
          expect '[RagoCombatEngine] Mode override, default profile vanilla' logs/latest.log
          expect '[WorldEdit] Enabling WorldEdit v6.1' logs/latest.log
          expect "[RagoBuildTools] Worlds of $data/mondes" logs/latest.log
          expect '[RagoLobby] Lobby in the world lobby' logs/latest.log
          expect '[RagoPractice] Arenas in the world arenes' logs/latest.log
          expect '[RagoBedwars] Bed Wars maps ready: bw-demo;' logs/latest.log
          echo 'monde creer ci vide' >&3
          wait_for 'World ci created' 30 || fail "/monde creer did not create the world"
          echo 'schematic list' >&3
          wait_for 'ci-test' 15 || fail "WorldEdit does not list the schematics of $data/schematics"
          expect "dir: '$data/schematics'" plugins/WorldEdit/config.yml
          stop_server 1
          [ -f "$data/mondes/ci/level.dat" ] || fail "the world ci was not saved in $data/mondes"
          expect 'generateur: vide' "$data/mondes/ci/rago-monde.yml"

          start_server 2
          expect '[RagoBuildTools] World ci loaded' logs/latest.log
          # The demo map of RagoBedwars, made at the first launch, is read back from its folder.
          [ -f "$data/mondes/bw-demo/bedwars.yml" ] || fail "the Bed Wars demo map was not saved in $data/mondes"
          expect '[RagoBedwars] Bed Wars maps ready: bw-demo;' logs/latest.log
          [ -f "$data/mondes/lobby/level.dat" ] || fail "the lobby world was not saved in $data/mondes"
          archive=$(ls "$data"/sauvegardes/mondes-*.tar.gz | sort | tail -n 1)
          echo "Backup: $archive"
          tar -tzf "$archive" > backup.txt
          expect 'mondes/ci/level.dat' backup.txt
          expect 'mondes/ci/rago-monde.yml' backup.txt
          expect 'schematics/ci-test.schematic' backup.txt
          stop_server 2

      - name: Start the server twice (Windows)
        if: runner.os == 'Windows'
        working-directory: kit
        shell: pwsh
        run: |
          $data = Join-Path $env:USERPROFILE 'Rago'
          function Fail([string]$Text) {
            Write-Output "::error::$Text"
            if (Test-Path logs/latest.log) { Get-Content logs/latest.log }
            exit 1
          }
          function Assert-Log([string]$Text) {
            if (-not (Select-String -Path logs/latest.log -Pattern $Text -SimpleMatch -Quiet)) { Fail "missing in the server log: $Text" }
          }
          # The player's path: lancer-windows.bat, which runs lancer.ps1 with Windows PowerShell 5.1.
          # There is no console to type stop into, so the server is killed once it has started.
          function Invoke-Launch([string]$Name) {
            $launcher = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'lancer-windows.bat' -PassThru `
              -RedirectStandardOutput "launch-$Name.log" -RedirectStandardError "launch-$Name.err" -WorkingDirectory $PWD
            $started = $false
            $launchedAt = Get-Date
            $deadline = $launchedAt.AddMinutes(8)
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path logs/latest.log) -and (Select-String -Path logs/latest.log -Pattern 'Done (' -SimpleMatch -Quiet)) {
                $started = $true
                break
              }
              if ($launcher.HasExited) { break }
              # Once lancer.ps1 has ended, the batch file waits on "pause": stop waiting for the server.
              $launcherScript = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($launcher.Id) AND Name = 'powershell.exe'")
              if ($launcherScript.Count -eq 0 -and ((Get-Date) - $launchedAt).TotalSeconds -gt 15) { break }
              Start-Sleep -Seconds 2
            }
            Get-Content "launch-$Name.log", "launch-$Name.err" -ErrorAction SilentlyContinue
            taskkill /T /F /PID $launcher.Id 2>$null
            Start-Sleep -Seconds 3
            if (-not $started) { Fail "the server did not start (launch $Name)" }
          }

          Invoke-Launch 1
          foreach ($expected in 'git-PandaSpigot-226', '[RagoCombatEngine] Mode override, default profile vanilla',
              '[WorldEdit] Enabling WorldEdit v6.1', "[RagoBuildTools] Worlds of $data\mondes",
              '[RagoLobby] Lobby in the world lobby', '[RagoPractice] Arenas in the world arenes',
              '[RagoBedwars] Bed Wars maps ready: bw-demo;') {
            Assert-Log $expected
          }
          $config = Get-Content plugins/WorldEdit/config.yml -Raw
          if (-not $config.Contains("dir: '$($data.Replace('\', '/'))/schematics'")) { Fail "WorldEdit config.yml: $config" }
          Move-Item logs/latest.log logs/launch-1.log

          Invoke-Launch 2
          $archive = Get-ChildItem -LiteralPath (Join-Path $data 'sauvegardes') -Filter 'mondes-*.zip' |
            Sort-Object Name | Select-Object -Last 1
          if (-not $archive) { Fail "no backup in $data\sauvegardes" }
          Write-Output "Backup: $($archive.FullName)"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try { $entries = @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
          if (-not ($entries | Where-Object { $_ -like 'mondes/world/*' })) { Fail "the backup has no mondes/world: $entries" }
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-server-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            kit/launch.log
            kit/logs/
          if-no-files-found: warn
